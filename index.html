<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hollow Descent wiki</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Pixelify+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:light;
  --bg:#e7e4ec;--panel:#f3f1f6;--panel2:#dcd8e3;--edge:#a69db6;--line:#cdc7d6;
  --text:#211d29;--dim:#5b5464;--faint:#867f8f;--strong:#120f17;
  --gold:#8a6512;--red:#a9302f;--blood:#8d1f2a;--green:#2f7a2c;--blue:#2f55b2;--cyan:#16747c;--violet:#6a3fae;
  --magenta:#93338a;--orange:#a65312;--ice:#2b6f8f;--toxic:#4b7a18;--bone:#6f6750;--ash:#6c6660;--yellow:#856d08;
  --gray:#5f5b66;--teal:#18725e;--moss:#56701c;--void:#5b37c6;
  --r-text:#3a3542;--r-rare:#2f55b2;--r-epic:#8236a8;--r-legend:#8a6512;--r-unique:#b2342b;--r-setc:#257a3c;
  --r-mythic:#b8216d;--r-ascended:#0f7c74;--cel-l:38%;--pri-a:#b4471b;--pri-b:#d06a10;--ete-l:40%;
  --tile:#d3cedb;--sel:#efe7cf;--tipbg:#f7f5fa;--tipedge:#8d84a0;
  --display:"Pixelify Sans","Atkinson Hyperlegible",system-ui,sans-serif;
  --body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;
  --bg:#100e14;--panel:#18151e;--panel2:#201c28;--edge:#4e465c;--line:#2c2736;
  --text:#d6d0c6;--dim:#968e8a;--faint:#6c6670;--strong:#f0ece4;
  --gold:#ecbe48;--red:#ce4040;--blood:#c83a48;--green:#6ec468;--blue:#628ce6;--cyan:#60ced6;--violet:#ac80ec;
  --magenta:#cc66c4;--orange:#e88638;--ice:#96d6f0;--toxic:#8cd25a;--bone:#e2dcc8;--ash:#b0aaa4;--yellow:#f0d65a;
  --gray:#8a8690;--teal:#48c4a8;--moss:#96be50;--void:#9668ff;
  --r-text:#d6d0c6;--r-rare:#6296f0;--r-epic:#ba68e6;--r-legend:#f0be3c;--r-unique:#e45448;--r-setc:#60d678;
  --r-mythic:#ff5caa;--r-ascended:#6ef6e8;--cel-l:86%;--pri-a:#ff4628;--pri-b:#ffbe46;--ete-l:66%;
  --tile:#1c1924;--sel:#2a2433;--tipbg:#0c0b0f;--tipedge:#342e3e;
}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#100e14;--panel:#18151e;--panel2:#201c28;--edge:#4e465c;--line:#2c2736;
  --text:#d6d0c6;--dim:#968e8a;--faint:#6c6670;--strong:#f0ece4;
  --gold:#ecbe48;--red:#ce4040;--blood:#c83a48;--green:#6ec468;--blue:#628ce6;--cyan:#60ced6;--violet:#ac80ec;
  --magenta:#cc66c4;--orange:#e88638;--ice:#96d6f0;--toxic:#8cd25a;--bone:#e2dcc8;--ash:#b0aaa4;--yellow:#f0d65a;
  --gray:#8a8690;--teal:#48c4a8;--moss:#96be50;--void:#9668ff;
  --r-text:#d6d0c6;--r-rare:#6296f0;--r-epic:#ba68e6;--r-legend:#f0be3c;--r-unique:#e45448;--r-setc:#60d678;
  --r-mythic:#ff5caa;--r-ascended:#6ef6e8;--cel-l:86%;--pri-a:#ff4628;--pri-b:#ffbe46;--ete-l:66%;
  --tile:#1c1924;--sel:#2a2433;--tipbg:#0c0b0f;--tipedge:#342e3e;
}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 120px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.55 var(--body);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--panel)}
a{color:inherit;text-decoration-color:var(--edge);text-underline-offset:3px}
a:hover{text-decoration-color:currentColor}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
img.px,.ico{image-rendering:pixelated;image-rendering:crisp-edges}
code{font-size:.9em;background:var(--panel2);padding:0 .3em;border-radius:2px}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--panel);border-bottom:1px solid var(--edge);
  display:grid;grid-template-columns:auto 1fr auto;gap:12px 20px;align-items:center;padding:10px 20px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;font:600 20px/1 var(--display);color:var(--strong);white-space:nowrap}
.brand small{font:400 14px var(--display);color:var(--dim)}
.search{position:relative;max-width:520px;width:100%}
.search input{width:100%;font:16px var(--body);color:var(--text);background:var(--bg);border:1px solid var(--edge);border-radius:2px;padding:8px 12px 8px 34px}
.search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--faint)}
.results{position:absolute;left:0;right:0;top:calc(100% + 4px);background:var(--panel);border:1px solid var(--edge);max-height:60vh;overflow:auto;display:none;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.results.on{display:block}
.results a{display:grid;grid-template-columns:32px 1fr auto;gap:10px;align-items:center;padding:6px 10px;text-decoration:none;border-bottom:1px solid var(--line)}
.results a.hl,.results a:hover{background:var(--sel)}
.results .cat{color:var(--faint);font-size:13px}
.results .sn{font-size:13px;color:var(--dim);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.results .none{padding:10px;color:var(--dim)}
.depth{display:flex;align-items:center;gap:8px}
.depth label{font:500 15px var(--display);color:var(--dim)}
.depth output{font:700 24px/1 var(--body);color:var(--gold);min-width:2ch;text-align:center}
.depth button{font:600 16px/1 var(--display);width:28px;height:28px;border:1px solid var(--edge);background:var(--bg);color:var(--text);border-radius:2px;cursor:pointer}
.depth input[type=range]{width:150px;accent-color:var(--gold)}
.flavor{grid-column:1/-1;margin:0;font-size:14px;color:var(--dim);display:flex;gap:12px;flex-wrap:wrap}
.flavor b{color:var(--text);font-weight:700}
.menu-btn{display:none}

.wrap{display:grid;grid-template-columns:228px minmax(0,1fr);min-height:calc(100vh - 100px)}
nav.side{border-right:1px solid var(--line);padding:18px 14px 40px 20px;position:sticky;top:96px;align-self:start;max-height:calc(100vh - 96px);overflow:auto}
nav.side h4{font:500 15px var(--display);color:var(--faint);margin:18px 0 4px}
nav.side h4:first-child{margin-top:0}
nav.side a{display:flex;justify-content:space-between;padding:3px 8px;margin:0 -8px;text-decoration:none;color:var(--dim);border-radius:2px}
nav.side a span{color:var(--faint);font-size:13px}
nav.side a:hover{color:var(--text)}
nav.side a.on{background:var(--panel2);color:var(--strong)}
main{padding:28px 36px 80px;max-width:1080px;min-width:0}

h1{font:600 40px/1.1 var(--display);color:var(--strong);margin:0 0 6px}
h2{font:600 24px/1.2 var(--display);color:var(--strong);margin:36px 0 10px}
h3{font-size:18px;margin:24px 0 6px;color:var(--strong)}
p{margin:0 0 12px;max-width:72ch}
.lede{font-size:18px;color:var(--dim);max-width:64ch;margin-bottom:22px}
.crumb{font-size:14px;color:var(--faint);margin-bottom:10px}
.crumb a{color:var(--dim)}
.muted{color:var(--dim)}
.small{font-size:14px}
.note{font-size:14px;color:var(--dim);max-width:72ch}

.tw{overflow-x:auto;margin:8px 0 18px}
table{border-collapse:collapse;width:100%;font-size:15px}
th{font:500 15px var(--display);color:var(--dim);text-align:left;padding:6px 10px;border-bottom:1px solid var(--edge);white-space:nowrap}
th[data-sort]{cursor:pointer}
th[data-sort]:hover{color:var(--text)}
th.num,td.num{text-align:right;font-variant-numeric:tabular-nums}
td{padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:top}
tr.go{cursor:pointer}
tr.go:hover td{background:var(--sel)}
tr.flash td{animation:flash 1.6s ease-out}
@keyframes flash{from{background:color-mix(in srgb,var(--gold) 35%,transparent)}to{background:transparent}}
td.sp{width:1%;padding:3px 8px}
tr.off td{opacity:.55}

.chips{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0}
.chips button{font:15px var(--body);color:var(--dim);background:transparent;border:1px solid var(--line);padding:3px 10px;border-radius:2px;cursor:pointer}
.chips button[aria-pressed=true]{background:var(--panel2);border-color:var(--edge);color:var(--strong)}

.tag{display:inline-block;font-size:13px;line-height:1.5;padding:0 6px;margin:1px 4px 1px 0;border:1px solid var(--line);border-radius:2px;color:var(--dim);white-space:nowrap}
.plinth{background:var(--tile);border:1px solid var(--line);display:inline-flex;align-items:center;justify-content:center;border-radius:2px}
.hero{display:grid;grid-template-columns:auto minmax(0,1fr);gap:28px;align-items:start;margin-bottom:8px}
.hero .plinth{padding:16px;min-width:140px;min-height:140px}
.statline{display:flex;flex-wrap:wrap;gap:4px 26px;margin:14px 0}
.stat{display:flex;flex-direction:column}
.stat b{font:700 24px/1.1 var(--body);color:var(--strong);font-variant-numeric:tabular-nums}
.stat span{font-size:13px;color:var(--faint)}
.stat.elite b{color:var(--gold)}
.box{background:var(--panel);border:1px solid var(--line);padding:14px 18px;margin:12px 0;border-radius:2px}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:4px 28px}
.quote{border-left:2px solid var(--edge);padding:2px 0 2px 14px;color:var(--dim);margin:8px 0;max-width:68ch}
.def{display:grid;grid-template-columns:max-content 1fr;gap:4px 16px;margin:8px 0;font-size:15px}
.def dt{color:var(--faint)}
.def dd{margin:0}
ul.plain{padding-left:18px;margin:6px 0 12px}
ul.plain li{margin:3px 0;max-width:72ch}
.idx{columns:3 220px;column-gap:28px;padding:0;margin:10px 0 0;list-style:none}
.idx li{break-inside:avoid;margin:0 0 18px}
.idx h3{margin:0 0 4px;font:500 17px var(--display);color:var(--faint)}
.idx a{display:flex;justify-content:space-between;text-decoration:none;padding:2px 0;color:var(--text)}
.idx a span{color:var(--faint);font-size:14px}
.roster{display:flex;flex-wrap:wrap;gap:4px 8px;margin:14px 0 22px}
.roster a{display:flex;flex-direction:column;align-items:center;gap:6px;text-decoration:none;width:108px;padding:12px 4px 10px;border-radius:2px}
.roster a:hover{background:var(--panel2)}
.roster a b{font:500 16px var(--display)}
.roster a span{font-size:13px;color:var(--faint);margin-top:-6px}

.strata{margin:26px 0 8px;user-select:none}
.strata .row{display:grid;grid-template-columns:repeat(48,minmax(0,1fr));gap:2px;align-items:end}
.strata .cell{height:34px;border:0;padding:0;cursor:pointer;border-radius:1px;position:relative}
.strata .cell.g{height:52px}
.strata .cell.cur{outline:2px solid var(--gold);outline-offset:1px;z-index:1}
.strata .marks{display:grid;grid-template-columns:repeat(48,minmax(0,1fr));gap:2px;height:44px;align-items:end;margin-bottom:4px}
.strata .marks img{justify-self:center;max-width:none}
.strata .ax{display:grid;grid-template-columns:repeat(48,minmax(0,1fr));gap:2px;font:400 12px var(--body);color:var(--faint);margin-top:4px}
.strata .ax span{text-align:center}
.z1{background:#7b6f88}.z2{background:#6a5878}.z3{background:#5a4566}.z4{background:#463155}.za{background:#2f2050}
.legend{display:flex;flex-wrap:wrap;gap:4px 18px;font-size:14px;color:var(--dim);margin-top:8px}
.legend i{display:inline-block;width:12px;height:12px;margin-right:6px;vertical-align:-1px;border-radius:1px}
.miles{margin:18px 0 0;padding:0;list-style:none;display:grid;grid-template-columns:max-content 1fr;gap:4px 16px;max-width:760px}
.miles dt{font:700 17px var(--body);color:var(--gold);text-align:right}
.miles dd{margin:0}

.tiers{display:flex;flex-wrap:wrap;gap:4px;margin:8px 0}
.tiers button{border:1px solid var(--line);background:var(--tile);padding:4px;border-radius:2px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;font:12px var(--body);color:var(--faint);width:64px}
.tiers button[aria-pressed=true]{border-color:var(--gold);color:var(--strong);background:var(--sel)}
select{font:15px var(--body);color:var(--text);background:var(--bg);border:1px solid var(--edge);border-radius:2px;padding:4px 8px}
.sw{display:inline-block;width:11px;height:11px;border-radius:1px;margin-right:6px;vertical-align:-1px;border:1px solid rgba(0,0,0,.25)}
.talents{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:4px 24px}
.talents ol{margin:4px 0 0;padding-left:20px}
.talents li{margin:4px 0}
.skill{display:grid;grid-template-columns:auto 1fr;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.skill:last-child{border-bottom:0}
.skill h4{margin:0;font-size:16px}
.skill .meta{font-size:14px;color:var(--faint)}
.changelog h3{font:600 20px var(--display);margin-top:30px}
.changelog li{margin:4px 0;max-width:76ch}

.r-text{color:var(--r-text)}.r-rare{color:var(--r-rare)}.r-epic{color:var(--r-epic)}.r-legend{color:var(--r-legend)}
.r-unique{color:var(--r-unique)}.r-setc{color:var(--r-setc)}.r-mythic{color:var(--r-mythic)}.r-ascended{color:var(--r-ascended)}
.r-celestial{animation:cel 3s steps(24) infinite;color:hsl(45 60% var(--cel-l))}
.r-primordial{animation:pri 2.4s ease-in-out infinite alternate;color:var(--pri-a)}
.r-eternal{animation:ete 3s steps(24) infinite;color:hsl(0 80% var(--ete-l))}
@keyframes cel{0%{color:hsl(0 60% var(--cel-l))}25%{color:hsl(90 60% var(--cel-l))}50%{color:hsl(180 60% var(--cel-l))}75%{color:hsl(270 60% var(--cel-l))}100%{color:hsl(360 60% var(--cel-l))}}
@keyframes pri{from{color:var(--pri-a)}to{color:var(--pri-b)}}
@keyframes ete{0%{color:hsl(0 80% var(--ete-l))}25%{color:hsl(180 80% var(--ete-l))}50%{color:hsl(0 80% var(--ete-l))}75%{color:hsl(180 80% var(--ete-l))}100%{color:hsl(360 80% var(--ete-l))}}
@media (prefers-reduced-motion:reduce){.r-celestial,.r-primordial,.r-eternal,tr.flash td{animation:none}}
.c-red{color:var(--red)}.c-blood{color:var(--blood)}.c-green{color:var(--green)}.c-blue{color:var(--blue)}.c-cyan{color:var(--cyan)}
.c-violet{color:var(--violet)}.c-magenta{color:var(--magenta)}.c-orange{color:var(--orange)}.c-ice{color:var(--ice)}
.c-toxic{color:var(--toxic)}.c-bone{color:var(--bone)}.c-ash{color:var(--ash)}.c-yellow{color:var(--yellow)}.c-gray{color:var(--gray)}
.c-teal{color:var(--teal)}.c-moss{color:var(--moss)}.c-void{color:var(--void)}.c-gold{color:var(--gold)}

.title{position:relative;overflow:hidden;height:clamp(250px,34vw,380px);margin:-28px -36px 30px;background:#08070b;container-type:inline-size;isolation:isolate}
.title .bd{position:absolute;left:0;top:50%;max-width:none;transform:translate(0,-50%);opacity:0;transition:opacity 1.8s ease-in-out;animation:pan 46s ease-in-out infinite alternate}
.title .bd.on{opacity:1}
@keyframes pan{from{transform:translate(0,-50%)}to{transform:translate(calc(-100% + 100cqw),-50%)}}
.title::after{content:"";position:absolute;inset:0;z-index:1;background:radial-gradient(ellipse at 50% 55%,rgba(0,0,0,.28) 30%,rgba(0,0,0,.82) 100%),rgba(0,0,0,.3);pointer-events:none}
.title .logo{position:absolute;z-index:3;left:clamp(18px,6.2%,80px);top:clamp(22px,8%,56px);animation:drop 1.5s steps(10) both}
.title .logo .base,.title .logo .des{display:block}
.title .logo .des{position:absolute;inset:0;background:#aa1e28;-webkit-mask:var(--m) 0 0/100% 100% no-repeat;mask:var(--m) 0 0/100% 100% no-repeat;animation:descent 2.42s ease-in-out infinite alternate}
@keyframes drop{from{transform:translateY(-20px)}to{transform:none}}
@keyframes descent{from{background:#aa1e28}to{background:#ce4040}}
.title .tagline{position:absolute;z-index:3;left:clamp(22px,6.6%,84px);bottom:clamp(40px,14%,70px);margin:0;font:500 clamp(15px,1.9vw,19px) var(--display);color:#968e8a;text-shadow:2px 2px 0 #000;max-width:none}
.title .corner{position:absolute;z-index:3;bottom:10px;font:400 13px var(--display);color:#5c5660;text-shadow:1px 1px 0 #000}
.title .ember{position:absolute;z-index:2;bottom:-6px;width:4px;height:4px;background:#ffb04a;box-shadow:0 0 6px #e88638;animation:ember linear infinite;opacity:0}
@keyframes ember{0%{transform:translate(0,0);opacity:0}10%{opacity:.9}100%{transform:translate(var(--dx),calc(-1 * var(--h)));opacity:0}}
.tip{position:fixed;z-index:60;pointer-events:none;width:max-content;max-width:300px;background:var(--tipbg);border:1px solid var(--tipedge);box-shadow:2px 2px 0 rgba(0,0,0,.45);padding:8px 10px 9px;font-size:14px;line-height:1.4;color:var(--text);display:none}
.tip.on{display:block;animation:tipin .14s steps(3) both}
@keyframes tipin{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.tip .tt{font:600 16px/1.2 var(--display);color:var(--strong);margin:0 0 3px}
.tip .tc{font-size:12px;color:var(--faint);margin-bottom:4px}
.tip .tr{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start}
.tip .tl{color:var(--dim)}
.tip .ts{color:var(--strong);font-weight:700}
main.enter{animation:enter .24s steps(4) both}
@keyframes enter{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.idle{animation:idle 1.96s steps(1) infinite}
@keyframes idle{0%,64%{transform:none}65%,100%{transform:translateY(calc(var(--px,2px) * -1))}}
.roster a:hover img,.roster a:focus-visible img{animation:hop .3s steps(3)}
@keyframes hop{0%,100%{transform:none}50%{transform:translateY(-6px)}}
.bump{animation:bump .22s steps(3)}
@keyframes bump{0%,100%{transform:none}40%{transform:translateY(-3px)}}
.changed{animation:changed .9s steps(6)}
@keyframes changed{0%{color:var(--gold)}100%{}}
.pop{position:fixed;z-index:70;pointer-events:none;font:700 17px var(--body);text-shadow:2px 2px 0 #000;transform:translate(-50%,-50%);animation:pop .9s cubic-bezier(.2,.8,.3,1) forwards}
@keyframes pop{0%{opacity:0;transform:translate(-50%,-30%)}15%{opacity:1}70%{opacity:1}100%{opacity:0;transform:translate(-50%,-180%)}}
.strata .cell{transition:transform .1s steps(2)}
.strata .cell:hover{transform:translateY(-3px)}
.results.on{animation:tipin .14s steps(3) both}
.depth output.bump{display:inline-block}
@media (prefers-reduced-motion:reduce){.title .bd,.title .logo,.title .logo .des,.title .ember,.tip.on,main.enter,.idle,.roster a:hover img,.bump,.changed,.pop,.results.on{animation:none!important}.title .ember,.pop{display:none}.title .bd{transition:none}}
@media (max-width:900px){
  .top{grid-template-columns:minmax(0,1fr) auto;padding:10px 14px}
  .top>div:first-child{min-width:0}
  .brand{min-width:0;overflow:hidden}
  .brand span{overflow:hidden;text-overflow:ellipsis}
  .search{grid-column:1/-1;grid-row:2;max-width:none}
  .depth{justify-self:end}
  .depth input[type=range]{width:90px}
  .flavor{display:none}
  .menu-btn{display:inline-flex;font:500 15px var(--display);background:transparent;border:1px solid var(--edge);color:var(--text);padding:4px 10px;border-radius:2px;margin-right:6px}
  .wrap{grid-template-columns:1fr}
  nav.side{display:none;position:static;max-height:none;border-right:0;border-bottom:1px solid var(--line);columns:2 160px}
  nav.side.open{display:block}
  nav.side h4{break-after:avoid}
  main{padding:20px 16px 60px}
  .title{margin:-20px -16px 24px}
  h1{font-size:32px}
  .hero{grid-template-columns:1fr}
  .strata .marks{display:none}
  .strata .ax span:nth-child(odd){visibility:hidden}
}
@media (max-width:520px){
  .brand small{display:none}
  .brand{font-size:17px}
  .depth{gap:5px}
  .depth label{display:none}
  .depth input[type=range]{display:none}
}
</style>

tack":0,"hit":0,"block":3,"kill":1,"still":2,"floor":0,"tip":"Focus trickles back every turn, and three times as fast while you stand still."},"Faith":{"rest":false,"color":"gold","start":0.5,"regen":0,"refill":true,"combat_only":false,"decay":0,"attack":1,"hit":1,"block":4,"kill":2,"still":0,"floor":0,"tip":"Faith grows when you guard, strike, take blows and win fights. It doesn't regenerate on its own."},"Reagents":{"rest":true,"color":"toxic","start":1.0,"regen":1,"refill":true,"combat_only":false,"decay":0,"attack":0,"hit":0,"block":2,"kill":1,"still":0,"floor":0,"tip":"Reagents regenerate slowly. Salvaging gear and searching bodies turns up more."},"Void":{"rest":false,"color":"void","start":0.5,"regen":0,"refill":false,"combat_only":true,"decay":2,"attack":3,"hit":3,"block":2,"kill":5,"still":0,"floor":4,"tip":"Void gathers as you kill, strike and bleed, and drains fast when nothing threatens you."}},"affixes":{"Armored":"+3 armor.","Vampiric":"Heals for half the damage it deals.","Swift":"35% chance to act twice.","Venomous":"Its attacks Poison.","Frenzied":"+50% damage below half HP.","Explosive":"Bursts when slain, damaging everything nearby.","Regenerating":"Heals every turn.","Thorned":"Reflects 20% of melee damage back at you.","Hexing":"Its attacks Weaken.","Hulking":"+60% HP.","Spectral":"Physical attacks pass through it 40% of the time. Magic always lands.","Splitting":"Splits into two lesser copies when slain.","Commanding":"Nearby allies deal 25% more damage.","Warding":"Shields nearby allies with block every turn.","Unstoppable":"Immune to Stun and Chill.","Abyssal":"Risen from the Abyss, far stronger than its kin."},"intents":{"hit":"Will attack for {d}.","bite":"Will bite for {d} and Poison.","slash":"Will slash for {d} and cause Bleed.","drain":"Will drain {d} HP.","steal":"Will try to steal gold.","heavy":"Winding up a crushing blow: {d}. Step out of the red.","fuse":"Lighting its fuse.","explode":"About to explode for {d}! Get clear of the red.","web":"Will spit webbing (Stun).","curse":"Will hex you (Weak).","shoot":"Will shoot for {d}.","bolt":"Will cast a bolt for {d}.","mend":"Will heal an ally.","summon":"Will summon reinforcements.","reanimate":"Will raise a corpse.","protect":"Will shield its allies.","warcry":"Will rally its allies (Enraged).","guard":"Will raise its guard.","regen":"Will regenerate.","slam":"Will slam the ground: {d} to the red area.","sweep":"Will sweep around itself for {d}.","charge":"Will charge along the red line for {d}.","webburst":"Will spray webs on the red area (Stun).","miasma":"Will hurl a cloud of rot at the red area.","flask":"Will throw a flask at the red area.","inhale":"Drawing breath. Fire comes next turn.","breath":"Will breathe fire across the red cone for {d}!","roar":"Will roar (Enraged, and Vulnerable on you).","meteor":"Will call down burning rock on the red tiles: {d}.","flee":"Trying to escape with your gold!","move":"Closing in."},"effects":{"poison":{"name":"Poison","col":"violet","debuff":true},"burn":{"name":"Burn","col":"orange","debuff":true},"bleed":{"name":"Bleed","col":"red","debuff":true},"chill":{"name":"Chill","col":"ice","debuff":true},"stun":{"name":"Stun","col":"yellow","debuff":true},"weak":{"name":"Weak","col":"gray","debuff":true},"vuln":{"name":"Vulnerable","col":"yellow","debuff":true},"regen":{"name":"Regen","col":"green","debuff":false},"evasive":{"name":"Evasive","col":"cyan","debuff":false},"marked":{"name":"Marked","col":"teal","debuff":true},"bearform":{"name":"Bear Form","col":"orange","debuff":false},"enraged":{"name":"Enraged","col":"red","debuff":false}},"perks":{"Toughness":"+10 max HP","Brutality":"+2 ATK","Insight":"+2 ARC","Precision":"+6% crit chance","Agility":"+5% dodge","Bloodthirst":"+5% lifesteal","Spiked Hide":"+3 thorns","Deep Reserves":"+4 max MP or Rage","Iron Skin":"+1 armor","Deadly":"+25% crit damage","Scavenger":"+20% gold found","Meditation":"+1 MP or Rage per turn"},"relics":{"Bloodstone":"Heal 5 HP whenever an enemy dies.","Ember Heart":"+20% chance to Burn on hit.","Frost Sigil":"+20% chance to Chill on hit.","Hourglass":"Skill cooldowns are 1 turn shorter.","Glass Cannon":"+40% damage dealt, but -25% max HP.","Lucky Coin":"+8% crit chance and +25% gold.","Phoenix Feather":"Once per run, revive at 50% HP.","Vampire Fang":"+8% lifesteal.","Mana Prism":"+1 MP or Rage per turn.","Warding Totem":"Start every fight with 12 block.","Executioner's Mark":"+50% damage to enemies below 30% HP.","Iron Will":"You cannot be Stunned.","Alchemist's Kit":"Consumables are 50% stronger.","Cartographer's Map":"Every floor is fully mapped when you arrive.","Thief's Gloves":"Merchants charge 25% less, and nothing can steal from you.","Overcharger":"Elemental reactions deal double damage.","War Banner":"Allies deal +50% damage. Start fights with +3 MP or Rage.","Blood Chalice":"Health Potions also grant Regen.","Hunter's Eye":"+25% damage against elites and bosses.","Lantern of Dusk":"Your light reaches 3 tiles farther."},"curses":{"bloodmoon":{"name":"Blood Moon","desc":"Enemies deal 25% more damage.","mult":0.3},"horde":{"name":"Horde","desc":"Enemy packs are larger.","mult":0.25},"mutation":{"name":"Mutation","desc":"Enemy modifiers appear far more often.","mult":0.3},"elites":{"name":"Elite Hunt","desc":"Elite packs are far more common.","mult":0.2},"famine":{"name":"Famine","desc":"Merchants charge double and chests hold fewer potions.","mult":0.2},"fragile":{"name":"Fragile","desc":"-20% max HP.","mult":0.25},"darkness":{"name":"Darkness","desc":"Your light radius is much smaller.","mult":0.15}},"consumables":{"potion":{"name":"Health Potion","desc":"Restore 35% HP.","icon":"potion"},"tonic":{"name":"Mana Tonic","desc":"Restore 10 MP or Rage.","icon":"tonic"},"bomb":{"name":"Fire Bomb","desc":"Throw: damage and Burn everything in a small area.","icon":"bomb"},"antidote":{"name":"Antidote","desc":"Cleanse all debuffs.","icon":"antidote"}},"mats":{"scrap":"Iron Scrap","dust":"Arcane Dust","void":"Void Shard"},"biomes":{"calm":{"name":"Quiet Halls","desc":"Nothing unusual stirs here.","col":"ash","senses":["Silence presses in from every side.","Your footsteps echo longer than they should.","Dust sifts down from the ceiling."],"enemies":[]},"flooded":{"name":"Flooded Crypt","desc":"Ankle-deep water. Burns cannot take hold.","col":"ice","senses":["Water laps at your ankles, cold enough to ache.","Something brushes your leg beneath the surface.","The drip of water sounds almost like whispering."],"enemies":["Bog Lurker"]},"volcanic":{"name":"Magma Vents","desc":"Lava seeps through the floor. Burns are twice as strong.","col":"orange","senses":["Heat rolls up through cracks in the floor.","Embers drift past like slow red insects.","The rock is hot enough to blister bare skin."],"enemies":["Flame Spirit"]},"frozen":{"name":"Frozen Caverns","desc":"Bitter cold. Chill effects are doubled.","col":"ice","senses":["Your breath hangs in the air.","Frost feathers the walls in pale patterns.","Ice creaks somewhere overhead."],"enemies":["Ice Wraith"]},"miasma":{"name":"Miasma Pits","desc":"Clouds of toxic gas drift through the halls.","col":"toxic","senses":["The air tastes of rot and copper.","Green vapor curls along the floor.","Your eyes water. Every breath feels borrowed."],"enemies":["Myconid"]},"haunted":{"name":"Haunted Galleries","desc":"Restless spirits. Enemies carry modifiers more often.","col":"violet","senses":["A whisper says your name, then laughs.","The candles gutter though there is no wind.","For a moment you see someone standing behind you in a puddle's reflection."],"enemies":["Banshee"]},"gilded":{"name":"Gilded Vaults","desc":"Old treasure everywhere. +50% gold found.","col":"gold","senses":["Coins are pressed into the mortar like scales.","Gilt flakes from the walls at your touch.","Gold dust glitters in the air, thick enough to taste."],"enemies":["Gilded Golem"]},"shrouded":{"name":"Shrouded Depths","desc":"A thick fog swallows your light.","col":"dim","senses":["The fog swallows your torchlight at arm's length.","Shapes move at the edge of the mist.","Sounds arrive from the wrong direction."],"enemies":["Shade"]},"hallowed":{"name":"Hallowed Ground","desc":"Shrines always bless, and you slowly heal while exploring.","col":"bone","senses":["Faint chanting rises from nowhere.","The air here feels clean, almost kind.","Old prayers are carved into every stone."],"enemies":[]},"overgrown":{"name":"Overgrown Ruins","desc":"Roots split the stone. Spores hang in the air.","col":"green","senses":["Roots split the flagstones like knuckles through a glove.","Pale moss glows where your torch doesn't reach.","Something rustles in the leaves, then stops when you do."],"enemies":["Thornback","Myconid"]},"meadow":{"name":"Sunless Meadow","desc":"Grass and open sky, a mile underground. You see far, and so does everything else.","col":"green","senses":["Wind moves through the grass. There is no wind this deep.","Birdsong, faint and slightly wrong.","The light is warm and comes from everywhere at once."],"enemies":["Dire Wolf","Wild Boar","Scarecrow"]},"highlands":{"name":"Hollow Highlands","desc":"Wind-cut rock and ravines under a sky that shouldn't exist. Sight runs long.","col":"bone","senses":["The air is thin and cold, as if you climbed instead of fell.","Far off, rock cracks and tumbles.","Clouds drift under a ceiling you can't see."],"enemies":["Crag Golem","Sky Harpy","Dire Wolf"]},"wildwood":{"name":"The Underwood","desc":"A forest grown in the dark. Trees hide whatever waits between them.","col":"toxic","senses":["Leaves fall without a single branch moving.","Something large shifts between the trunks.","The trees lean toward you when you aren't looking."],"enemies":["Treant","Dire Wolf","Wild Boar"]},"dunes":{"name":"Glass Dunes","desc":"Sand, mesas and a light with no sun behind it.","col":"gold","senses":["Sand hisses across the ground in long ribbons.","The heat makes the horizon ripple.","Your footprints fill in behind you."],"enemies":["Sand Wyrm","Dune Scarab","Dune Scarab"]},"fen":{"name":"Drowned Fen","desc":"Marsh water and rotting trees. Strange lights drift over the bog.","col":"cyan","senses":["Bubbles rise from the black water, smelling of eggs.","Pale lights bob over the reeds and then go out.","Every step sucks at your boots."],"enemies":["Bog Lurker","Will-o'-Wisp","Will-o'-Wisp"]},"abyss":{"name":"The Abyss","desc":"Below the bottom of the world. Everything here is stronger, and so is the loot.","col":"violet","senses":["The floor feels thin, as if something below is listening.","Your shadow falls the wrong way.","Somewhere far down, a bell rings once and never stops."],"enemies":["Void Spawn","Abyssal Horror"]}},"layouts":[{"id":"l-rooms","key":"rooms","name":"Chambers","weight":14,"sizes":"SML","boss":true,"intro":["Chambers and corridors, cut by careful hands long ago."]},{"id":"l-crypt","key":"crypt","name":"Crypt","weight":9,"sizes":"ML","boss":true,"intro":["Rows of burial vaults, sealed and stacked. Some of the seals are broken from the inside."]},{"id":"l-halls","key":"halls","name":"Great Halls","weight":8,"sizes":"MLX","boss":true,"intro":["Vast pillared halls. Your footsteps carry a long, long way."]},{"id":"l-mines","key":"mines","name":"Old Mines","weight":6,"sizes":"SML","boss":true,"intro":["Old mine tunnels shored with rotting timber. Pickaxes lie where they were dropped."]},{"id":"l-ruins","key":"ruins","name":"Ruins","weight":6,"sizes":"ML","boss":true,"intro":["Collapsed rooms and broken walls. Something brought this place down."]},{"id":"l-caves","key":"caves","name":"Caverns","weight":7,"sizes":"SMLX","boss":true,"intro":["Natural caverns, wet and winding, never touched by tools."]},{"id":"l-maze","key":"maze","name":"Labyrinth","weight":5,"sizes":"SM","boss":true,"intro":["A labyrinth. Whoever built it wanted something kept in, or kept out."]},{"id":"l-cathedral","key":"cathedral","name":"Cathedral","weight":5,"sizes":"LX","boss":false,"intro":["A cathedral carved from the living rock, perfectly mirrored on either side."]},{"id":"l-rings","key":"rings","name":"Ringed Keep","weight":4,"sizes":"MLX","boss":false,"intro":["Walls inside walls inside walls. Something valuable sits at the center."]},{"id":"l-cells","key":"cells","name":"Prison Block","weight":5,"sizes":"ML","boss":true,"intro":["A prison block. Rows of cells, most of them open."]},{"id":"l-city","key":"city","name":"Buried City","weight":5,"sizes":"LX","boss":false,"intro":["Streets. Houses. A whole town, buried and silent."]},{"id":"l-hub","key":"hub","name":"Rotunda","weight":5,"sizes":"MLX","boss":false,"intro":["A great rotunda with passages running out like spokes."]},{"id":"l-warrens","key":"warrens","name":"Warrens","weight":5,"sizes":"SM","boss":true,"intro":["Cramped burrows packed one against the next, like a hive."]},{"id":"l-islands","key":"islands","name":"Sunken Isles","weight":4,"sizes":"ML","boss":true,"intro":["Islands of stone in a black void, tied together by narrow bridges."]},{"id":"l-lake","key":"lake","name":"Lake Cavern","weight":4,"sizes":"LX","boss":false,"intro":["A cavern swallowed by a lake. The water doesn't reflect your torch."]},{"id":"l-sewers","key":"sewers","name":"Cisterns","weight":4,"sizes":"ML","boss":false,"intro":["Cisterns and canals. The water still runs, though nothing up there feeds it."]},{"id":"l-garden","key":"garden","name":"Hanging Gardens","weight":4,"sizes":"ML","boss":true,"intro":["Indoor gardens, overgrown and strange, lit by fungus instead of sun."]},{"id":"l-split","key":"split","name":"Fault Line","weight":8,"sizes":"LX","boss":false,"intro":["The floor is cut by a great fault. The two halves were built by different hands."]}],"outdoor":[{"id":"l-meadow","key":"meadow","name":"Sunless Meadow","intro":["The tunnel opens onto a meadow under a pale, sunless sky. You are still underground. You are sure of it.","Grass, open air and wildflowers. Somewhere above, the mountain still presses down."],"props":["log","stump","standingstone","bones"]},{"id":"l-highlands","key":"highlands","name":"Hollow Highlands","intro":["You step out onto a windswept ridge. The Hollow has room for mountains, apparently.","Cliffs and ravines stretch off under a false sky the color of old slate."],"props":["standingstone","log","bones","stump"]},{"id":"l-wildwood","key":"wildwood","name":"Underwood","intro":["A forest. Real trees, thick and old, growing a mile below the light.","The passage ends in a wall of trunks. Paths wind away into green dark."],"props":["log","stump","mushrooms","log"]},{"id":"l-dunes","key":"dunes","name":"Glass Dunes","intro":["Sand pours out of the corridor ahead of you, into a desert that glows from nowhere.","Dunes roll away under a white sky. Your throat dries at the sight."],"props":["bones","standingstone","bones","corpse"]},{"id":"l-fen","key":"fen","name":"Drowned Fen","intro":["The floor turns to mud, then to marsh. Dead trees stand in water as still as glass.","A drowned country opens up ahead, full of reeds and slow black pools."],"props":["log","stump","bones","mushrooms"]},{"id":"l-voidplain","key":"voidplain","name":"Starfall Steppe","intro":["The Abyss opens into a plain of violet grass beneath a sky full of falling stars.","Crystal spires stand in fields that hum like a struck bell."],"props":["standingstone","bones","statue","standingstone"]}],"rooms":[["merchant","Hesk's stall","Every floor","Hesk sets up on every floor."],["vault","Vault","65% from floor 2, never on guardian floors","A small room behind a locked vault door. One monster on the floor carries the key (an elite if there is one), or it sits in a chest. Rogues can pick the lock (60%, and a snapped pick jams it). The vault chest holds 2.5x gold, a Void Shard, a gem and a better-than-usual item."],["reliquary","Reliquary","70% on big open-air floors, 40% in the Abyss, 32% from floor 2, 25% on guardian floors","A pedestal holding one Unique relic, guarded by dormant elites that wake when you lift it."],["specialist","Specialist","45% from floor 3","Either Vesh the Collector or the Jeweler sets up shop. At most one per floor."],["forge","Forge","75%","An anvil for tempering, reforging, imbuing, socketing and purifying."],["camp","Campfire","70%","Rest or train once. Talent resets stay available after."],["mercs","Mercenary camp","45% from floor 2","A Captain hires out sellswords and sells warband charters."],["ascension","Altar of Ascension","50% in the Abyss, 22% from floor 6","Turns a Mythic item Ascended for 3 Void Shards."],["starfall","Fallen Star","40% in the Abyss","Turns an Ascended item Celestial for 6 Void Shards, or heals you and leaves gifts."],["wellspring","Wellspring","35% from floor 25","Feeds Celestial items into Primordial, and past floor 32 Primordial into Eternal."],["armory","Armory","30%","Three pieces of gear on racks. You may take one."],["shrine","Shrine","60%","Pray for a blessing, or pay gold for a random perk."],["trial","Altar of Trials","45% from floor 2","Summons two elites. Beat both and pick a relic."],["event","Event room","Up to three per floor (100%, 80%, 40%)","One of fourteen encounters: knights, imps, cages, altars and stranger things."],["treasure","Treasure room","One guaranteed, a second at 70%","Extra chests, with the usual risk of a Mimic."]],"landmarks":[{"id":"anvil","name":"Anvil (forge)","sprite":"prop_anvil","text":"Five kinds of work, all paid in gold and materials.","ops":[["Temper","+1 to an item, up to +5. Each + raises every positive stat by 20% of its value (at least 1).","{temper}g and 2 + 2 per existing + Iron Scrap (triple both for Mythic and up)"],["Reforge","Rerolls the item's modifiers. You can revert to the old roll. Not for Common, Unique or Set gear.","2 Arcane Dust (4 Dust and 2 Void Shards for Mythic and up)"],["Imbue","Raises an item one rarity (Common to Rare, Rare to Epic, Epic to Legendary) and adds one modifier. Not for Unique or Set gear.","4 Arcane Dust and 1 Void Shard"],["Socket","Adds an empty socket, up to the item's cap.","5 Iron Scrap and 1 Arcane Dust"],["Purify","Removes a curse (bane) so the item can come off.","2 Void Shards"]]},{"id":"camp","name":"Campfire","sprite":"prop_camp","text":"One use per fire. Rest heals 40% HP, refills your resource and fully heals companions. Train raises one skill a rank (up to III). Once the fire is spent you can still reset your talents there for gold.","cost":"respec"},{"id":"shrine","name":"Shrine","sprite":"prop_shrine","text":"Pray: 45% full heal and refill, 25% +5 max HP, 15% +3% crit, 15% it hurts you for a fifth of your max HP. On Hallowed Ground prayers always heal. Or offer gold for a random perk.","cost":"shrine"},{"id":"trial","name":"Altar of Trials","sprite":"prop_trial","text":"Accepting summons an aware elite pack of two. Kill both and choose a relic."},{"id":"ascension","name":"Altar of Ascension","sprite":"prop_ascension","text":"Lay a Mythic item on it with 3 Void Shards and it becomes Ascended: two powers and an extra socket. One use."},{"id":"starfall","name":"Fallen Star","sprite":"prop_starfall","text":"Abyss only. An Ascended item and 6 Void Shards become Celestial. Or touch the star for a full heal, a Perfect gem and 3 Void Shards. One use."},{"id":"wellspring","name":"Wellspring","sprite":"prop_wellspring","text":"From floor 25. A Celestial item and 10 Void Shards become Primordial. Past floor 32, a Primordial item and 16 Void Shards become Eternal. Or drink: full heal, 4 Void Shards and two Perfect gems. One use."},{"id":"reliquary","name":"Reliquary","sprite":"prop_reliquary","text":"A pedestal with one Unique relic on it. Relics you have never found are three times as likely to appear. Lifting it wakes everything within 8 tiles. Needs a free pack slot."},{"id":"armory","name":"Armory","sprite":"prop_armory","text":"Three items on the racks. Take one and the rest are gone."},{"id":"chest","name":"Chest","sprite":"prop_chest","text":"Gold scaled by depth, with a 35% potion (15% under Famine), 30% gem, 55% gear and 10% journal page. Ordinary chests have an 8% + 1% per floor chance of being a Mimic."},{"id":"barrel","name":"Barrels and crates","sprite":"prop_barrel","text":"Smash to open: 30% chance of gold or a potion, otherwise 6% for a journal page."},{"id":"chasm","name":"Chasm","sprite":null,"text":"Step in to drop straight to the next floor for 15% of your max HP. Sealed while a guardian lives, and above a guardian's lair."},{"id":"stairs","name":"Stairs","sprite":null,"text":"Leads down. On guardian floors a seal bars them until the guardian falls."}],"traps":[["Spikes","4 + 2 per floor damage, minus half your armor."],["Darts","2 + floor damage and Poison."],["Gas","Drains your resource to zero and leaves a gas cloud."],["Alarm","A bell rings and an aware pack comes running."]],"npcs":[{"id":"hesk","name":"Hesk","sprite":"hesk","text":"The Hollow's general merchant, on every floor. Sells potions, tonics, bombs, antidotes, Iron Scrap, Arcane Dust, two Chipped gems and six pieces of gear (plus a ranged weapon 30% of the time from floor 3). 35% of the time he also has a relic. Buys anything at half its value.","lines":["\"Ah, a new face. I'm Hesk. I sell things to people who are about to need them very badly.\"","\"Name's Hesk. I've been peddling in the Hollow longer than you've been alive. Buy something.\""]},{"id":"vesh","name":"Vesh the Collector","sprite":"collector","text":"A specialist. Stocks two Legendary items and a Set piece, plus a Mythic from floor 6, an Ascended in the Abyss and 30% of the time a Celestial from floor 20. Prices above Legendary are steep. Buys only Epic and better, at 75% of value.","lines":["\"Vesh. I collect things the Hollow was reluctant to give up. You may look. Please don't breathe on anything.\"","\"Rare goods at rare prices. If you have to ask, you have walked a long way to be disappointed.\"","\"Every piece on this rug outlived its owner. Some of them outlived several.\"","\"I also buy. Fine things only. Hesk can have your rusty spoons.\""]},{"id":"jeweler","name":"The Jeweler","sprite":"jeweler","text":"A specialist. Sells mystery gems (35% chance of a Flawless), polishes a gem up one tier for double, and drills a new socket into your best worn piece for triple.","lines":["A jeweler peers at you through a cracked loupe. \"Stones, polishing, holes drilled clean. Coin first.\"","\"Don't mind the coffin. He doesn't.\" The jeweler pats the lid he has set his trays on.","The jeweler sorts gems by the light of a candle that burns blue. \"Buying or polishing?\""]},{"id":"captain","name":"The Captain","sprite":"captain","text":"Runs mercenary camps. Hires out sellswords and sells up to two warband charters per run, each +1 party size.","lines":["\"Blades for hire. Coin up front, loyalty after.\"","\"My people are the best in the Hollow. The living ones, anyway.\"","\"You look like someone who needs friends. Friends cost money down here.\"","\"Every one of mine has walked out of the Hollow at least once. Mostly.\"","\"I don't ask what you're after down there, and they don't ask either. That costs extra.\"","\"Pay them well and they'll follow you into the dark. Pay them badly and they'll still follow, but slower.\"","\"The dead don't complain about wages. That's the only good thing about them.\""]},{"id":"wick","name":"Wick","sprite":"guide","text":"A lamplighter's ghost who waits on floor 1 for new players. Bump into him to ask questions. He also pops in with a tip card the first time things happen. Turn him off under Settings, Tutorial guide.","lines":["The ghost of an old lamplighter raises a lantern that gives off no heat. \"Name's Wick. Ask me anything. I've got time.\"","\"Still here? Good. Most folk don't stay alive long enough to ask me a second question.\""]}],"events":[{"id":"ev-knight","key":"knight","title":"The Wounded Knight","sprite":"knight","text":["A knight in a dented tabard sits in a pool of his own blood, sword across his knees.","\"Water... or a potion. Anything. I can pay.\""],"alt":[["A knight slumps against a pillar, his tabard torn and his breath ragged.","\"I'm not dying. I'm resting. Have you got a potion? For the resting.\""]],"options":["Give a potion: he leaves you a piece of gear (Rare or better).","Heal him with a potion and he joins you as a Knight.","Rob him for 15 + 5 per floor gold. Half the time his friends come back."]},{"id":"ev-fountain","key":"fountain","title":"The Glowing Fountain","sprite":"prop_fountain","text":["Water rises from a cracked basin, glowing like moonlight under ice."],"alt":[["A fountain carved like a weeping woman pours light instead of water."]],"options":["Drink: 40% full heal, 30% +3 max resource, 30% lose a quarter of your max HP.","Fill a flask: 60% chance of a Health Potion."]},{"id":"ev-gambler","key":"gambler","title":"The Bone-Card Imp","sprite":"gambler","text":["A grinning imp shuffles a deck of bone cards on an overturned crate.","\"A game, a game! Gold or blood, I take both!\""],"alt":[["An imp sits cross-legged on a pile of coins, rolling knucklebone dice.","\"Feeling lucky? Everybody's lucky, right up until they aren't!\""]],"options":["Gamble gold (20 + 5 per floor): 45% to double it. You can keep playing.","Wager a quarter of your max HP: 50% to pick a relic."]},{"id":"ev-strongdoor","key":"strongdoor","title":"The Strongroom","sprite":"prop_strongdoor","text":["A sealed strongroom door, its lock old but intact. Scratches around the keyhole say others have tried."],"alt":[],"options":["Force it: lose a seventh of your max HP, get an item.","Pick it: 40% (always for rogues) for a Rare or better item, otherwise an alarm brings a pack."]},{"id":"ev-blood_altar","key":"blood_altar","title":"The Black Altar","sprite":"prop_altar_blood","text":["A black stone altar, slick and warm. A voice inside your head asks for blood. A lot of it."],"alt":[],"options":["Sacrifice 8 max HP for a relic of your choice (needs more than 25 base max HP)."]},{"id":"ev-rack","key":"rack","title":"The Weapon Rack","sprite":"prop_rack","text":["A weapon rack, untouched by rust. Two pieces remain. There is only time to take one."],"alt":[],"options":["Two items. Take one."]},{"id":"ev-prisoner","key":"prisoner","title":"The Caged Prisoner","sprite":"prisoner","text":["A gaunt prisoner rattles a rusted cage.","\"Get me out and I'll fight for you. I swear it on whatever gods still listen down here.\""],"alt":[["Someone in a hanging cage swings gently as you pass.","\"Hey. Hey! Let me down and I'll make it worth your while.\""]],"options":["Free him for 15% of your HP. He joins with a weapon from the floor."]},{"id":"ev-library","key":"library","title":"The Forgotten Study","sprite":"prop_bookshelf","text":["Shelves of crumbling tomes line a forgotten study. A reading lamp still holds a little oil."],"alt":[["A study, books stacked to the ceiling. Someone left mid-sentence, quill still in the ink."]],"options":["Read: 55% to rank up a random skill, otherwise 50% for XP (15 + 6 per floor), otherwise the book bites. 25% chance of a journal page too."]},{"id":"ev-jeweler","key":"jeweler","title":"The Wandering Jeweler","sprite":"jeweler","text":["A wandering jeweler peers at you through a cracked loupe.","\"Gems? I cut gems. I also cut purses, but only for rude customers.\""],"alt":[["A jeweler has set up shop on an upturned coffin.","\"Stones, stones, lovely stones. Don't mind the coffin, he doesn't.\""]],"options":["Buy a mystery gem, or polish one up a tier."]},{"id":"ev-dark_altar","key":"dark_altar","title":"The Whispering Blade","sprite":"prop_altar_dark","text":["A weapon rests on a smoking altar. Whispers coil around it like vines, promising everything."],"alt":[],"options":["Take the blade: a cursed Legendary weapon. Strong, with a bane, and it won't come off until purified."]},{"id":"ev-wolf","key":"wolf","title":"The Snared Wolf","sprite":"wolf","text":["A grey wolf thrashes in a hunter's snare,
