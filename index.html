-quiver","name":"Bottomless Quiver","family":"quiver","stats":{"rdmg":3},"effect":"bottomless","desc":"Ranged weapons never need to reload and reach 1 tile farther.","lore":"A poacher made a deal with something in the Fen for a quiver that never empties. Nobody knows what the something got."},{"id":"u-liber-mortis","name":"Liber Mortis","family":"tome","stats":{"arc":3,"max_mp":5},"effect":"mortis","desc":"Your allies have 50% more HP.","lore":"The necromancer Oskar Thale wrote down every name he ever raised. The book is thick, and the names still answer when it opens."},{"id":"u-crown-of-storms","name":"Crown of Storms","family":"circlet","stats":{"arc":3,"crit":3},"effect":"stormcrown","desc":"Every 5th turn in combat, lightning strikes a nearby foe.","lore":"Worn by a mountain queen who ruled from inside a thundercloud. It crackles whenever someone says her name."},{"id":"u-gauntlets-of-the-ox","name":"Gauntlets of the Ox","family":"gauntlets","stats":{"atk":3,"df":1},"effect":"ox","desc":"+25% ATK, but -10% dodge.","lore":"The gloves of a miner who hauled a cart of ore up two thousand steps every morning for forty years. They still want to work."},{"id":"u-sevenleague-boots","name":"Sevenleague Boots","family":"boots","stats":{"dodge":6},"effect":"sevenleague","desc":"Walking has a 25% chance not to use your turn.","lore":"A courier's boots, enchanted to cross seven leagues in a step. He ran into the Hollow with a message and never ran out."},{"id":"u-heart-of-the-mountain","name":"Heart of the Mountain","family":"pendant","stats":{"max_hp":30,"df":2,"dodge":-8},"effect":"mountain","desc":"Slow, but nearly immovable.","lore":"A pebble from the deepest root of the mountain, heavy as a promise. Whoever wears it is very hard to move."},{"id":"u-ouroboros-ring","name":"Ouroboros Ring","family":"band","stats":{"crit":4},"effect":"ouroboros","desc":"Heal 2% of your max HP at the start of every combat turn.","lore":"A snake eating its own tail. It keeps you alive because it intends to be the one that finishes you."},{"id":"u-echo-charm","name":"Echo Charm","family":"talisman","stats":{"max_mp":4},"effect":"echo","desc":"25% chance a skill costs nothing and skips its cooldown.","lore":"It hums back every spell spoken near it, a little late and a little louder."},{"id":"u-gamblers-die","name":"Gambler's Die","family":"coil","stats":{"crit":10},"effect":"gamble","desc":"Your damage swings anywhere from 50% to 175%.","lore":"Hesk lost this in a card game and has been trying to win it back ever since. Don't tell him you have it."},{"id":"u-band-of-the-warlord","name":"Band of the Warlord","family":"signet","stats":{"ally":40},"effect":"warband","desc":"You can lead one more ally.","lore":"The signet of a mercenary general who never lost a soldier. His soldiers say he simply never let them die."},{"id":"u-eye-of-the-hollow","name":"Eye of the Hollow","family":"seal","stats":{"light":1},"effect":"eye","desc":"Every floor is mapped on arrival.","lore":"A seal set with a stone that is not a stone. It blinks. It has already seen every floor below you."}],"sets":[{"id":"s-embersworn","name":"Embersworn","pieces":{"main":"longsword","chest":"chainmail","head":"helm","hands":"gauntlets","amulet":"pendant"},"extra":{"burn_hit":8},"color":"#e66e32","bonus":["Your Burns are 50% stronger.","Reactions deal double, and Burns leap to a new foe when their host dies.","Burning foes take double damage from you."]},{"id":"s-frostbound","name":"Frostbound","pieces":{"main":"mace","chest":"plate","head":"greathelm","feet":"sabatons","ring":"seal"},"extra":{"chill_hit":8},"color":"#8cd2f0","bonus":["Your Chill applies an extra stack.","+50% damage to Stunned or Frozen foes.","Every hit Chills."]},{"id":"s-bloodmoon-pact","name":"Bloodmoon Pact","pieces":{"main":"greataxe","chest":"brigandine","hands":"claws","amulet":"fang","ring":"band"},"extra":{"lifesteal":2},"color":"#aa1e28","bonus":["+10% lifesteal.","Lifesteal beyond full HP becomes block.","Kills restore 10% of your max HP."]},{"id":"s-gravewalker","name":"Gravewalker","pieces":{"main":"scythe","chest":"robe","head":"hood","off":"tome","amulet":"totem"},"extra":{"arc":1},"color":"#6eaa78","bonus":["Allies deal 40% more damage.","Slain enemies have a 30% chance to rise as your ally.","You can lead one more ally, and allies heal 5% each turn."]},{"id":"s-nightstalker","name":"Nightstalker","pieces":{"main":"dagger","chest":"cloak","hands":"wraps","feet":"spurboots","ranged":"knives"},"extra":{"crit":2},"color":"#463c64","bonus":["+25% crit damage.","Critical hits cause Bleed and restore 2 MP or Rage.","Critical hits reset a random skill's cooldown."]},{"id":"s-bulwark","name":"Bulwark","pieces":{"main":"mace","off":"tower","chest":"plate","head":"greathelm","feet":"greaves"},"extra":{"guard":3},"color":"#c8c8dc","bonus":["Guarding grants 50% more block.","Half your block carries over, and blocked damage is thrown back.","Guarding also heals 5% of your max HP."]},{"id":"s-arcanist","name":"Arcanist","pieces":{"main":"wand","off":"orb","chest":"robe","head":"wizardhat","ring":"loop"},"extra":{"arc":1},"color":"#6e78e6","bonus":["Skills cost 1 less (minimum 1).","Skills deal 20% more damage and may skip their cooldown.","Skills deal another 25% more damage."]},{"id":"s-wildstrider","name":"Wildstrider","pieces":{"ranged":"longbow","chest":"vest","hands":"gloves","feet":"boots","off":"quiver"},"extra":{"rdmg":1},"color":"#5a9646","bonus":["+25% ranged damage.","Ranged weapons never need to reload.","Every ranged hit looses a second arrow at another foe."]},{"id":"s-wardens-vow","name":"Warden's Vow","pieces":{"main":"halberd","chest":"scalemail","head":"hornedhelm","hands":"gauntlets","feet":"greaves"},"extra":{"ally":10},"color":"#c8aa50","bonus":["Allies have 30% more HP.","Allies deal 40% more damage.","You can lead one more ally."]}],"titles":[["Grim","Dusk","Star","Blood","Hollow","Ash","Storm","Night","Bone","Soul","Doom","Oath","Wyrm","Sun","Void","Frost","Ember","Dread","Hex","Moon","Thorn","Raven","Gloom","Iron","Dawn","Rune"],["fang","bane","song","brand","reaver","heart","ward","shard","call","fall","bringer","weaver","maw","crown","veil","edge","grasp","tide","whisper","breaker","fire","light","wake","rend"]],"journal":["Day 1. The surveyors were right. Gold in the deep seam, more than the King's whole treasury. We start digging tomorrow. -- Foreman Aldous Varr","Day 30. The deeper shafts run warm. The men joke that we have dug down to hell. I have stopped laughing at the joke.","Day 58. Found a sealed gate on the fourth level, carved with skulls. The priest says leave it shut. The King's man says open it.","Day 61. We opened it. Something in armor walked out and killed eleven men before we drove it back. We call it the Warden now.","Day 90. The spiders on the eighth level are getting larger. Tomas swears he saw one the size of a cart. Tomas has not come back up.","Day 104. A physician arrived from the capital with a cure for the coughing sickness. He asks a great many questions about the dead.","Day 130. The gold in the lowest seam is soft and warm to the touch. It moves when no one is watching it. I have told no one.","Day 151. The cultists say the mountain is not a mountain. They say it is a sleeper, and we have been mining its scales.","Day 160. The ground breathed today. Everyone felt it. Half the crew quit. The other half are greedier than they are afraid.","Day 171. I went down alone to the last seam. Two eyes opened in the gold. They were not angry. They were patient.","Day 172. I am sealing the Hollow. Let the King hang me for it. Whatever sleeps down there must never wake hungry.","There is no date on this page, and the handwriting shakes. It is awake. It was always awake. It was waiting for someone strong enough to be worth eating."],"floorintro":{"1":"The entrance halls. Torchlight dies a few paces in, as if the dark were eating it.","2":"Old mine tunnels shored with rotting timber. Pickaxes lie where they were dropped.","3":"A forgotten barracks. Rusted shields, empty bunks, and a smell like wet iron.","4":"The walls turn to fitted stone. Someone built this place on purpose. Someone guards it.","5":"Catacombs. Thousands of niches carved into the rock. The empty ones bother you more.","6":"A drowned chapel. Hymnals float in black water, swollen and unreadable.","7":"Galleries of carved faces. Every one of them has had its eyes chiseled out.","8":"Webs thick as sailcloth sag from the ceiling. Something large keeps this level tidy.","9":"The stone grows warm underfoot. Far below, something breathes, slow and enormous.","10":"A city, once. Streets and doorways cut into the rock, all of them silent.","11":"Ash drifts down like snow. The heat makes the air shimmer and lie to you.","12":"The bottom of the Hollow. Molten gold glows in the cracks of the floor."},"abyssintro":["The stairs keep going after the bottom. The walls are wet with something that isn't water.","Stars hang in the dark below you, and they are looking up.","There is no ceiling here. There is no floor either, quite.","The air hums like a struck bell. Every step echoes a moment before you take it.","Bones of things larger than the mountain line the walls, polished smooth by something patient."],"guide":[["How do turns work?",["\"Nothing down here moves until you do. Every step, swing or sip of a potion is one turn, and then everything else takes its turn.\"","\"So take your time. Think. The Hollow is patient, and you can be too.\""]],["How do I fight?",["\"Walk into a monster to hit it. The little icon over its head is what it means to do next turn.\"","\"Red tiles on the floor get struck next turn. Step off them, or press Space to guard.\"","\"Number keys 1 to 5 are your skills. Press once to aim, press again or click to let fly.\""]],["What do I do with loot?",["\"Walk over things to pick them up. Press I to open your pack and equip them. A green arrow means it beats what you're wearing.\"","\"Bodies stay where they drop. Stand on one and press G to search it.\"","\"Junk you don't want? Salvage it in your pack for scrap and dust, and spend those at an anvil.\""]],["Where do I go?",["\"Down. Always down. Press X and you'll explore on your own. Press it again once the floor is cleared, and you'll walk to the stairs.\"","\"M shows the whole map. Click it to drop a waypoint, then press T to walk there.\"","\"Every fourth floor a guardian seals the stairs. You'll know it when you meet it.\""]],["Anything else?",["\"Bump into chests, anvils, shrines and strange folk. Most of them are worth it.\"","\"Rest with R when it's quiet. Drink a potion with 6 when it isn't.\"","\"And if you find a pedestal with something old on it, take it. Those relics only rest in one place.\""]]],"guidecards":{"start":"Nothing down here moves until you do. Walk with WASD or the arrows, or click a tile. Come bump into me if you want to ask something.","enemy":"Something's spotted you. The icon above its head is what it'll do next turn. Walk into it to attack.","tele":"Red tiles get hit next turn. Step off them, or press Space to guard and soak the blow.","loot":"Walk over loot to pick it up, then press I to equip it. A green arrow means it beats what you're wearing.","corpse":"Bodies stay where they fall. Stand on one and press G to search it, burn it, or use it your own way.","skills":"Number keys 1 to 5 fire your skills. Press once to aim, then press again or click to let fly.","hurt":"You're hurt. Press 6 for a health potion, or R to rest once nothing's chasing you.","prop":"Bump into chests, anvils, shrines and strangers to use them. Most are worth a look.","stairs":"That's the way down. Press X to explore the rest of the floor, then X again to walk to the stairs.","level":"You grew stronger. Every other level gives a talent point. Spend it on the Talents tab of your pack (I).","map":"M opens the full map. Click to drop a waypoint and press T to walk to it. Get close and it clears itself.","done":"That's all I've got. The rest you learn by bleeding. Good luck down there."},"epitaphs":["The Hollow keeps what it takes.","They went down, and down, and down.","Brave, briefly.","Their torch still burns somewhere below.","Mourned by no one. Remembered by the rats.","They came for gold. They found a grave."],"controls":[["Arrows / WASD / numpad","Move. Q E Z C move diagonally. Walk into enemies to attack and into things to use them."],["Mouse","Click a tile to walk there, click an enemy next to you to hit it, hover anything for details."],["1-5","Skills (slot 5 is your specialization skill). Targeted skills highlight a target: press the key again or click to fire, Tab to cycle."],["6 7 8 9","Health potion, mana tonic, fire bomb, antidote"],["G","Pick up items, or search, burn or use a body you're standing on"],["F","Fire your ranged weapon (F or click again to shoot, Tab to cycle targets)"],["Space","Guard (gain block and resource)"],[". or numpad 5","Wait a turn"],["X","Explore automatically (press again when done to walk to the stairs)"],["T","Walk to the nearest waypoint (click the full map to drop up to four). Waypoints clear when you get within a tile."],["R","Rest until healed"],["I / Tab","Pack: Gear, Companions and Talents tabs. Tab cycles them."],["Mouse wheel \u00b7 - / =","Zoom the camera out or in (open-air floors start zoomed out)"],["M \u00b7 L \u00b7 Esc","Map \u00b7 message log \u00b7 menu"]],"changelog":"<h3 id='v-v8-7'>V8.7: Relics and Ruin (October 21, 2026)<\/h3>\n<ul>\n<li>Four new material tiers past Starmetal: Voidsteel, Sunforged, Eclipsed and Godsteel, with matching wood, leather, cloth, jewel and bone. Gear in the Abyss keeps climbing until about floor 40 instead of topping out at floor 13.<\/li>\n<li>Two new rarities above Celestial. Primordial gear has four powers and three extra sockets; Eternal has five. Primordial drops from Abyss guardians from floor 24 on and, very rarely, from deep elites. Eternal drops from guardians past floor 36.<\/li>\n<li>The Wellspring, a new Abyss landmark from floor 25: feed it a Celestial item and 10 Void Shards to make it Primordial, or past floor 32 a Primordial item and 16 to make it Eternal. Or drink from it for a full heal and gifts.<\/li>\n<li>Enemies are much tougher deeper down. Health now has its own curve on top of the usual depth scaling: about 1.3x on floor 4, 2x on floor 12, 3.6x on floor 20 and 5x around floor 36. In testing, well-geared heroes went from killing most things in a single hit to needing two or three swings in the main dungeon and four or five deep in the Abyss. Exploding foes and raised corpses don't inherit the extra health, so blasts and undead stay fair.<\/li>\n<li>Uniques are relics now. All 26 have their own story and rest on their own pedestal in a Reliquary: a carpeted shrine indoors or a ruined hut in the open air, with dormant elites that wake when you lift the relic. They no longer drop from monsters, chests or merchants, and each can be found once per run.<\/li>\n<li>Relics grow with you. A Unique's stats rise to match every new floor you carry it down to, so one found on floor 3 still matters on floor 30. They also come with an extra socket. Bloodpact Blade now costs 1% of your max HP per turn, and Gravebloom Staff and the Ouroboros Ring heal a share of your max HP instead of a flat few points.<\/li>\n<li>Records keeps a codex of every relic you have found across all your runs, and the Reliquary favors ones you haven't found yet.<\/li>\n<li>Prices above Legendary went way up. Sets cost 3.5 times their value, Uniques 4, Mythic 7, Ascended 12, Celestial 18 and Primordial and Eternal far more. Hesk no longer sells Mythic gear.<\/li>\n<li>Merchants specialize. Every floor still has one Hesk for general goods, and some floors add a single specialist who does something different: Vesh the Collector sells Legendary, Set and Mythic pieces (Ascended and better in the Abyss) and buys fine gear at 75% of its value, or the Jeweler sells gems, polishes them and drills new sockets into your gear. The Jeweler no longer turns up as a random event, and no floor repeats the same event.<\/li>\n<li>Necromancers command an army. They can keep up to 5 undead on top of their living companions, counted separately. Gravecaller adds 3 more, and Crypt Lord and Unending in the Legion tree add one each, for 10 in all. The Companions tab shows both counts, its rows shrink to fit a crowd, the button for undead now says Release, and the side panel folds extra companions into one line.<\/li>\n<li>The Voidwalker is rebuilt as the hardest class to play and the strongest when played well. It has 32 HP, no armor, healing only half takes, and every combat turn you go without hurting something gnaws away 3% of your HP. In return it deals 50% more damage, its crits hit for +100%, its ATK 10 and ARC 9 are the highest in the game, Rend, Void Rift, Unmake and Phase Strike all hit harder, and Unmake resets when it kills. Void drains faster outside fights.<\/li>\n<li>The Voidwalker is now unlocked by killing the Abyssal guardian on floor 24, the third gate, instead of the first one on floor 16. The first two tell you how many gates are left. Classes you've already unlocked stay unlocked.<\/li>\n<li>Daily runs pay out. Your first attempt each day earns shards for reaching floors 4 and 8, and clearing floor 12 adds 40 shards, 10 more per day of your streak (up to 5), and a sealed cache that gives you a random cheap Ossuary upgrade for free. Records shows your daily wins and best streak, and the class screen shows your streak.<\/li>\n<li>A tutorial. Wick, the ghost of an old lamplighter, waits on floor 1 and answers questions if you bump into him. On the first four floors he pops in at the top left with a tip the first time something happens: your first enemy, red tiles, loot, a body, low health, the stairs and so on. Each tip shows once. Settings has a Tutorial guide switch, and turning it back on replays every tip.<\/li>\n<li>Open-air floors are huge now, roughly 190 to 230 tiles wide and 120 to 150 tall, four to five times their old size. They have more clearings, more ruined huts, extra events, chests, a campfire and a shrine, and a good chance of a Reliquary. The explore bounty asks for 40% of an open-air floor.<\/li>\n<li>The world is drawn in chunks. Only the 24-by-24-tile pieces near the camera are rendered and kept in memory, so a huge floor costs no more to draw than a small one, and nothing is drawn ahead of time even if it's mapped. The side minimap only draws the part it shows.<\/li>\n<li>Bug fix: bodies no longer appear before the killing blow lands. When a companion's arrow or a spell takes a moment to fly, the enemy stays on screen until it hits, then falls and leaves its body.<\/li>\n<li>Bug fix: companions no longer attack enemies that already died earlier in the same turn, which showed hit text on corpses and wasted their attacks. Radiant gear no longer burns foes that are already dead.<\/li>\n<li>Bug fix: hovering and clicking on the full map no longer lands on the wrong square on high-resolution screens. The error grew the farther right and down you pointed.<\/li>\n<li>Waypoints clear themselves once you get within a tile of them, whether you walked there or pressed T, and walking to one stops there.<\/li>\n<li>The changelog shows the date of each update.<\/li>\n<\/ul>\n<h3 id='v-v8-6'>V8.6: Light and Sound (October 21, 2026)<\/h3>\n<p>### V8.6.6: Hotfix: Steady Camera, Sticky Windows (October 21, 2026)<\/p>\n<ul>\n<li>The title screen camera pans smoothly again. Two things from 8.6.5 were fighting it: the idle slowdown saw no keys being pressed and dropped the menu to 30 frames a second while the backdrop was still drifting, and GPU rendering threw away the sub-pixel part of the camera position, so the world crept along in whole-pixel steps. Menus with the moving backdrop no longer count as idle, and the graphics card path now keeps the fine offset.<\/li>\n<li>The same sub-pixel fix applies in a run, so walking and the camera following you are smoother with GPU rendering on.<\/li>\n<li>Clicking outside a window no longer closes it. The changelog, journal, records, map, message log and help screens now have a Back or Close button; Esc and the usual keys still work.<\/li>\n<li>Scrolling the mouse wheel no longer counts as a click, so it can't close a screen or skip text by accident.<\/li>\n<\/ul>\n<p>### V8.6.5: Performance Patch (October 21, 2026)<\/p>\n<ul>\n<li>GPU rendering. The finished picture is now scaled to your window by your graphics card instead of the processor. This was the biggest drain: on a 1080p screen the processor spent about 6 ms of every frame just resizing the image, and over 25 ms on high-resolution laptop screens, sixty times a second. If your computer has no usable graphics acceleration, the game quietly falls back to the old method. It can be turned off in Settings (GPU rendering) if the screen ever looks wrong.<\/li>\n<li>The game slows down when nothing is happening. Hollow Descent is turn-based, so most of the time the screen is only showing torch flicker and dust. After a second and a half with no input and nothing moving, it drops to 30 frames a second, and jumps straight back up the moment you press a key or something moves. In testing this roughly halved processor use while standing still.<\/li>\n<li>In the background it nearly stops: 15 frames a second when the window isn't focused, and when it's minimized it stops drawing entirely and only keeps the music going.<\/li>\n<li>Energy saver mode (Settings): caps the game at 30 fps, drops to 15 when idle and 8 in the background, updates lighting 12 times a second instead of 30, spawns half the ambient particles and spell bursts, and uses cheaper scaling when GPU rendering is unavailable. In testing, standing still on the same floor it used about a quarter of the processor time 8.6.2 did, and under half while walking around.<\/li>\n<li>A frame rate cap setting: 30, 60, 90 or 120.<\/li>\n<li>Culling: torches, props, items, corpses, traps, particles and glows that are off screen are skipped before they are drawn instead of being drawn and clipped.<\/li>\n<li>Faster lighting: the light map is built about a quarter faster, and the floor's color tint is folded into it, saving a full-screen pass every frame.<\/li>\n<li>Less repeated work every frame: text widths, translucent panels, the side panel's stats, portrait and bounty text, and the list of tiles ambient particles can spawn on are now remembered until something changes instead of being recalculated sixty times a second.<\/li>\n<li>A new app icon (a mine entrance under a dusk sky with a lit torch), used for the window, the taskbar and the Dock. On Windows the game now registers its own app identity, so the taskbar shows the Hollow Descent icon instead of Python's. On macOS the Dock icon is replaced too when PyObjC is installed. The icon files (icon.png and icon.ico) are in the assets folder for building a standalone app or a shortcut.<\/li>\n<li>The changelog groups hotfixes under their update: open V8.6 to see 8.6.1 through 8.6.6.<\/li>\n<\/ul>\n<p>### V8.6.4: Bug Fixes (October 21, 2026)<\/p>\n<ul>\n<li>Waypoint arrows no longer appear at the screen edge for waypoints that are already in view.<\/li>\n<li>Ambient particles no longer burst out all at once after a moment where no tiles were visible (after a cutscene or a floor change). The spawn timer is capped.<\/li>\n<li>Long companion names in the side panel are shortened by dropping a middle word (Risen Kobold Slinger becomes Risen Slinger) instead of being cut off mid-word.<\/li>\n<li>The glow images used for torches, items and particles were cached once per exact brightness, so flickering light kept creating near-identical copies. Colors are now rounded and the cache is capped.<\/li>\n<\/ul>\n<p>### V8.6.3: Bug Fixes (October 21, 2026)<\/p>\n<ul>\n<li>Fixed a memory leak: the minimap and full map kept a full-size picture of every floor you had visited for the rest of the session. On a 1080p screen that was 1 to 2 MB per floor, more on larger screens, and it never stopped growing in the Endless Abyss. Only the current floor is kept now.<\/li>\n<li>Fixed sound effects being rebuilt from scratch on every launch, which pinned a processor core for several seconds at the title screen. They are now built once and cached in the save folder.<\/li>\n<li>Old audio caches are cleaned up. The music that 8.6 composed on your computer (tens of megabytes of WAV files) is no longer used now that the tracks ship with the game, and ambience caches built for an older sample rate were left behind too. Both are deleted on launch.<\/li>\n<li>audio.log can no longer grow without limit; it starts over once it passes 64 KB.<\/li>\n<\/ul>\n<p>### V8.6.2: Hotfix: The Music Plays (October 21, 2026)<\/p>\n<ul>\n<li>Fixed music not playing. Tracks were loaded on a background thread, and starting one from that thread could collide with the volume fades running every frame, which stopped the track the instant it began. It then stayed silent, because the game thought it was already playing. Tracks now load in the background but only ever start on the main thread.<\/li>\n<li>Music loads before anything else at launch, so the title theme starts within a second instead of waiting for every sound effect to be built first.<\/li>\n<li>A watchdog checks the music once a second and restarts it if the channel ever goes quiet on its own. If a music file fails to load, the reason is written to audio.log in the save folder.<\/li>\n<\/ul>\n<p>### V8.6.1: Hotfix: Music, Maps and Open Skies (October 21, 2026)<\/p>\n<ul>\n<li>The music was rebuilt from scratch. Every track is now a real arranged piece: a lead melody that repeats and answers itself, a second instrument taking the bridge, a countermelody, chord pads, an arpeggio, a bass line pitched where you can actually hear it, and its own drums. 25 instruments in all (piano, nylon guitar, harp, flute, reed, strings, brass, choir, organ, marimba, kalimba, vibraphone, celesta, music box, glass and more), so the halls, the depths, the volcanic floors, the haunted waltz, the forests, the open sky by day and by night, the Abyss and each guardian all sound like different songs. The title theme stays slow and quiet so it doesn't blur into the game music.<\/li>\n<li>Music now plays continuously and loops without gaps. It used to be composed in the background on first launch, so a floor could sit silent for minutes until its track was ready (the Abyss tracks were last in line). The tracks now ship with the game and start instantly.<\/li>\n<li>Music is louder relative to ambience, especially in the Abyss.<\/li>\n<li>Music fades are handled by the game itself: tracks crossfade in about a second, going from the title screen into a run no longer takes several seconds to come in, and taking the stairs dips the music instead of stopping it.<\/li>\n<li>Cutscene captions show one paragraph at a time and the bottom bar grows to fit, so long guardian introductions no longer run off the screen. A key press finishes the paragraph, the next press moves on.<\/li>\n<li>Cutscene bars have a lit edge, so they stay visible on floors that are almost completely black.<\/li>\n<li>Open-air floors are far more common: roughly one floor in three, and never more than three regular floors without one (guardian floors stay indoors). The Abyss's Starfall Steppe follows the same rule. Two open-air floors never come back to back.<\/li>\n<li>Waypoints: open the map (M) and click to drop up to four waypoints, click one again to remove it, Backspace clears them. Press T (on the map or in the world) to walk to the nearest one. Waypoints show as pins with a light pillar in the world, as pins on the map and minimap, and as an arrow with the distance at the edge of the screen when they are out of view. They are saved with the floor.<\/li>\n<li>The minimap and full map were redrawn: rooms have a lit rim where floor meets wall, floor tiles have a subtle tone, trees are soft round canopies, and every marker (you, allies, enemies, elites, guardians, waypoints) is smooth instead of a jagged circle on the pixel grid.<\/li>\n<\/ul>\n<p>### V8.6: original release<\/p>\n<ul>\n<li>A new look. Every floor and wall texture was redrawn with brighter, cleaner palettes: flagstones are laid as slabs instead of speckled noise, bricks have proper highlights, wall tops read as solid stone instead of black, open-air ground is less noisy, and every sprite is a touch brighter. Prison grates now clearly look like metal floors, not holes.<\/li>\n<li>A new lighting engine. Light is colored and soft, strong light blooms instead of clipping, and many more things give off light: thrown fire, lightning, frost and hexes in flight, spell blasts, critical hits, burning foes, campfires, shrines, altars, merchants and level-ups. Areas you can see but that are far from your torch are lit by the room instead of falling to black.<\/li>\n<li>Open-air floors get drifting cloud shadows and sun beams by day, moonbeams at night.<\/li>\n<li>Every floor has its own color grade, set by biome, sky and guardian, with a small random shift per floor so no two look quite alike.<\/li>\n<li>Guardians glow with their own color, their telegraphed attacks light the floor red, and killing one sets off a slow-motion flash and burst. Skills of level 5 and up (including every specialization skill) fire with a screen flash, a shockwave and a burst of light.<\/li>\n<li>Cutscenes. A run now opens with your hero walking up the mountain at dusk and lighting a torch at the mine mouth. Guardians get an entrance: letterbox bars, the camera swings to them, they roar, and their name and words appear. Your first open-air floor of a run gets a slow reveal, your first step into the Abyss gets falling stars, and jumping into a chasm plays a fall down the shaft. Esc skips any cutscene, and they can be turned off in Settings.<\/li>\n<li>Sound effects were all remade, with two or three variants each so repeated hits, swings and steps don't sound identical. Guardians have their own roars, heavy guardian attacks slam, and guardian deaths have their own collapse.<\/li>\n<li>Voices: characters babble in their own voice as their lines type out, from Hesk's rasp to goblin squeaks to guardian rumbles. Monsters babble when they shout, and companions when they talk.<\/li>\n<li>Ambience: each floor plays its own background loop, chosen the same way as the music: dripping water, lava rumble, ice wind, whispering spirits, swamp insects, birdsong, crickets at night, desert wind, the hum of the Abyss or a quiet choir on hallowed floors. It has its own volume slider.<\/li>\n<li>Music overhaul: 16 tracks instead of 3, each with a calm layer and a combat layer that fades in when a fight starts. Stone halls, cold depths, the volcanic floors, haunted floors, overgrown floors, hallowed floors, open air by day and by night, and the Abyss each have their own track, and every guardian has its own theme. Short stingers play for guardian entrances, guardian kills, victory, the secret class, the Abyss and your first open sky.<\/li>\n<li>Music and ambience are composed in the background the first time you play and saved, so later launches start instantly.<\/li>\n<\/ul>\n<h3 id='v-v8-5'>V8.5: The Class Update (October 20, 2026)<\/h3>\n<ul>\n<li>Five new classes. The Ranger is open from the start: a tracker with bows, snares and a hawk, running on Focus, which refills three times as fast while you stand still. The Templar (50 shards) deals holy damage, shields the whole party and runs on Faith, which only grows by fighting, guarding and winning. The Alchemist (60 shards) throws fire and acid flasks, drinks risky elixirs and runs on Reagents, which salvaging refills. The Druid (80 shards) lashes with thorns, roots foes in place and turns into a cave bear, and is stronger under an open sky. The fifth class is a secret, and the class select screen only shows it as ???.<\/li>\n<li>Specializations. At level 5 every class picks one of two paths, twenty in all: Warlord or Sentinel, Shadowblade or Trickster, Pyromancer or Chronomancer, Bloodreaver or Juggernaut, Lichbound or Gravecaller, Beastmaster or Deadeye, Crusader or Oathkeeper, Bombardier or Plague Doctor, Wildshaper or Tempest, plus two for the secret class. Each one brings a new skill, its own stat bonuses and stronger versions of a base skill.<\/li>\n<li>Talents. Every other level gives a talent point. Each class has three branches of three tiers on the new Talents tab of your pack. Talents can be unlearned at a campfire for gold.<\/li>\n<li>The hotbar has five skill slots. Number keys are now 1-5 for skills and 6-9 for potion, tonic, bomb and antidote. Slot 5 holds your specialization skill.<\/li>\n<li>Every resource now follows its own rules: Mana regenerates, Rage builds in fights and drains outside them, Focus rewards standing still, Faith grows from guarding and kills, Reagents come back from salvage, and the secret class has one of its own.<\/li>\n<li>Bodies are useful to everyone. Stand on one and press G to search it for gold, potions, materials, gems or gear, or burn it so enemy necromancers and ghouls can't use it. Every class also has its own use: warriors strip armor for scrap, rogues check hidden pockets, mages study anatomy for experience, berserkers take trophies, rangers butcher for food and hide, necromancers harvest bone, templars give last rites, alchemists render reagents and druids return them to the soil. The Alchemist's Transmute turns a corpse into an item.<\/li>\n<li>Bigger parties. Captains sell warband charters (+1 party size, twice per run). The Ossuary, some talents and some specializations raise the cap too. The Ranger's hawk, the Beastmaster's wolf and the Gravecaller's Bone Colossus join as companions.<\/li>\n<li>The Ossuary has 23 upgrades instead of 8, in a new two-column layout: unlocks for the Templar, Alchemist and Druid, plus Warband, Old Lessons (talent points), Haggler, Powder Monkey, Tonic Brewer, Grave Robber, Deep Reserves, Lamplighter, Keen Edge, Jeweler's Pouch, Insight (experience) and Old Friend (start with a Sellsword).<\/li>\n<li>The class select screen is a grid of all ten classes with a detail panel: stats, trait, lore, skills and both specialization paths. It remembers the class you played last.<\/li>\n<li>Mage rebalance. Fireball 240% to 200% ARC, Frost Nova 90% to 80%, Chain Lightning 130% to 110%, starting ARC 7 to 6, and elemental reactions from Attunement 50% to 25%. Arcanist set bonuses dropped from +30%/+50% to +20%/+25%. Magic now ignores only half of armor instead of all of it.<\/li>\n<li>Guardians can no longer lose more than 18% of their health to a single hit, so no build can two-shot one.<\/li>\n<li>Mythic rebalance. Random Mythic drops start at floor 7 instead of 5 and are roughly a quarter as common. Guardians on floor 4 drop one 12% of the time (was 30%), floor 8 40% (was always), floor 12 one instead of two. Merchants stock them 10% of the time (was 22%) at a higher price. Mythic, Ascended and Celestial stat multipliers are lower, and every power was toned down: Soulfire, Thunderstruck and Echoing 20% to 12%, Sanguine 3% to 2%, Executioner below 10% HP (was 15%), Phasing 10%, Warlord +30%/+20%, Starfall every 5th turn for 180%, Bloodlust +4% up to +32%, Overflow every 4th skill, Retribution 25%, Radiant 1%, Quicksilver 8%, Titanic +15% HP and +2 armor, Archmage +15% ARC, Berserk +25%.<\/li>\n<li>Fix: freed prisoners, wolves, bears, golems, goblins, knights and delvers no longer leave a copy of themselves behind when they join you. They step out of the cage, snare or nest themselves.<\/li>\n<li>Fix: the explore bounty no longer completes the moment you arrive on open floors. It now counts ground you actually walk near, and asks for 75%.<\/li>\n<li>Fix: floors that could be cut in two by chasms, lava or furniture can no longer trap you. Floors are checked with lava counted as impassable, blocking props are moved, and if the stairs ever become unreachable the floor opens a new path. Chasms are also a way down now: step into one to drop to the next floor for about 15% of your HP (not while a guardian lives).<\/li>\n<li>Fix: auto-explore and auto-travel route around sleeping monsters, and stop before walking into one.<\/li>\n<li>More dialogue everywhere: about 40 more monsters have lines when they spot you, get hurt or die; companions talk on new floors, after fights and when hurt; your class has its own thoughts on arrival; Hesk has class-specific greetings; captains, events, campfires, chasms and the prologue all have new lines.<\/li>\n<li>Runs saved in V8.1 carry over. You get the talent points you would have earned, and a specialization choice if you're already past level 5.<\/li>\n<li>Groundwork for V8.6: music and lighting are now chosen from a context table (guardian, open-air sky, biome, layout, depth), so new tracks and color grades can be dropped in without touching game code.<\/li>\n<\/ul>\n<h3 id='v-v8-1'>V8.1: Clear Sight<\/h3>\n<ul>\n<li>Fullscreen now covers the whole display at its native resolution on Windows, macOS and Linux. Toggle it with F11, Alt+Enter, Cmd+Enter or Ctrl+Cmd+F. Windowed mode can be resized freely.<\/li>\n<li>Sharper picture. Retina and other high-DPI screens render at full pixel resolution, and Windows display scaling no longer stretches the window. A new Pixel scaling setting picks between Fill screen and Pixel-perfect (whole-number scaling with borders). Damage numbers no longer stretch to uneven sizes.<\/li>\n<li>Music loops cleanly with no seam or click.<\/li>\n<li>The minimap and full map are drawn at screen resolution: walls, doors, water, bridges, trees, chests, traps, allies, elites and bosses, a box showing your camera view, and floors tinted by biome.<\/li>\n<li>The title screen camera pans smoothly, and the dungeon behind the menu changes every 30 seconds with a crossfade.<\/li>\n<li>Texture fixes: doors, vault doors, stairs and traps now sit on the floor's own masonry or ground, walls get proper edges, chasms get lips, and Buried City carpets stay in the middle of the halls.<\/li>\n<li>Behind the scenes, class abilities and skills were reorganized so the V8.5 class update can slot in. Nothing about how the five classes play has changed.<\/li>\n<\/ul>\n<h3 id='v-v8'>V8: Open Air<\/h3>\n<ul>\n<li>The dungeon generator was rebuilt from scratch. Floors now come from 18 layouts: Chambers, Crypt, Great Halls, Old Mines, Ruins, Caverns, Labyrinth, Cathedral, Ringed Keep, Prison Block, Buried City, Rotunda, Warrens, Sunken Isles, Lake Cavern, Cisterns, Hanging Gardens and Fault Line (two layouts stitched together).<\/li>\n<li>Every floor also rolls its own map size, room shapes, corridor style, wall and floor masonry, and extras like rifts, flooding, collapsed rooms, overgrowth and carpets. A run won't repeat a layout within seven floors.<\/li>\n<li>About one floor in five opens into the open air: Sunless Meadow, Hollow Highlands, the Underwood, Glass Dunes and the Drowned Fen, plus the Starfall Steppe in the Abyss. Each gets a random sky (dawn, noon, dusk or night) and long sight lines.<\/li>\n<li>New wildlife for those floors: Dire Wolf, Wild Boar, Scarecrow, Crag Golem, Sky Harpy, Treant, Sand Wyrm, Dune Scarab and Will-o'-Wisp.<\/li>\n<li>Camera zoom on the mouse wheel or - and =. Open-air floors start zoomed out, drawn at full window resolution so the pixels stay sharp.<\/li>\n<li>Every floor is checked for full connectivity before you arrive. Auto-travel works across huge maps, and pathfinding runs about twice as fast.<\/li>\n<li>Long names no longer run off panels; they shorten or wrap. The message log and damage numbers use a crisp outline instead of a dark box behind the text.<\/li>\n<li>The Captain and the Armory have their own sprites instead of borrowing the crate.<\/li>\n<li>The map and minimap scale to any floor size, the floor banner names the layout, and this changelog exists.<\/li>\n<\/ul>\n<h3 id='v-v7'>V7: Arsenal and Allies<\/h3>\n<ul>\n<li>Ten gear slots on a paper doll: head, chest, hands, feet, main hand, off hand, ranged, amulet and two rings. Everything you wear shows on your hero.<\/li>\n<li>82 base items, each in eight material tiers, from Rusty and Burlap up to Starmetal and Starweave. Weapons carry traits like cleave, reach, bleed and stagger, and two-handers take both hands.<\/li>\n<li>A ranged slot fired with F: bows, crossbows, slings, javelins, throwing knives, bolas and wands, each with its own range, reload time and trick.<\/li>\n<li>Three rarities above Legendary. Mythic drops deep down, Ascended comes from the Altar of Ascension, and Celestial exists only in the Abyss. They carry 20 powers such as Starfall, Executioner and Quicksilver.<\/li>\n<li>Nine five-piece sets and 26 uniques.<\/li>\n<li>Companions: 16 types to hire, tame, free or recruit, with weapons you hand them from the Companions tab and veterancy that builds over time. Group following was rewritten so parties stay together.<\/li>\n<li>25 new monsters, plus natives for each biome like the Flame Spirit, Ice Wraith, Banshee and Abyssal Horror.<\/li>\n<li>Five dungeon layouts with chasms, and the Endless Abyss below floor 12 with Abyssal guardians every fourth floor.<\/li>\n<li>Balance: caps on dodge, crit and lifesteal, a fix for Ice Wraiths freeze-locking you, better Abyss loot, and shimmering motes around heroes in Ascended or Celestial gear.<\/li>\n<\/ul>\n<h3 id='v-v6'>V6: Into the Light<\/h3>\n<ul>\n<li>Hollow Descent became a real desktop game in Python and pygame-ce: turn-based, tile-based, pixel art.<\/li>\n<li>Every sprite, tile, icon, font glyph and sound is generated in code. There are no asset files.<\/li>\n<li>Dynamic lighting from torches, campfires and lava, fog of war, particles, projectiles, screen shake and floating damage numbers.<\/li>\n<li>Red telegraph tiles show where enemies will strike next turn, with intent icons over their heads.<\/li>\n<li>Mouse and keyboard play: click to walk, hover for tooltips, a hotbar, auto-explore, resting, a minimap and a full map.<\/li>\n<li>Screens for the pack, merchant, forge, level-ups, relics and boss intros, plus saving on quit, fullscreen and window scaling.<\/li>\n<li>Everything from the text era carried over: five classes, twelve floors, three guardians, biomes, relics, curses, bounties, the Ossuary, daily runs and the journal.<\/li>\n<\/ul>\n<h3 id='v-v5'>V5: Atmosphere (text)<\/h3>\n<ul>\n<li>A full-screen terminal interface with framed panels, color, a status sidebar and a block-letter title.<\/li>\n<li>Typewriter narration, prologues, class lore, floor introductions and room descriptions.<\/li>\n<li>Enemies and guardians talk in combat, Hesk the merchant got real dialogue, and runs end with epitaphs and epilogues.<\/li>\n<li>Foreman Varr's journal: pages to collect across runs.<\/li>\n<li>Runs in a normal terminal or as plain piped text.<\/li>\n<\/ul>\n<h3 id='v-v4'>V4: The Forge (text)<\/h3>\n<ul>\n<li>Salvage gear into iron scrap, arcane dust and void shards.<\/li>\n<li>The forge: temper, reforge, imbue and add sockets.<\/li>\n<li>Gems in three tiers to socket into gear.<\/li>\n<li>Cursed gear with banes: stronger than normal, stuck on you until purified.<\/li>\n<li>Item sets with bonuses for wearing several pieces.<\/li>\n<\/ul>\n<h3 id='v-v3'>V3: The Hollow (text)<\/h3>\n<ul>\n<li>A ground-up rewrite. Twelve floors with guardians on 4, 8 and 12.<\/li>\n<li>The Ossuary: shards earned every run buy permanent upgrades and unlock the Berserker and Necromancer.<\/li>\n<li>Biomes, each changing the rules of its floor.<\/li>\n<li>Elite enemies with stacked modifiers, minions, mimics and guardian phases.<\/li>\n<li>Daily runs, records, class passives and a floor map with a legend.<\/li>\n<\/ul>\n<h3 id='v-v2'>V2: Deeper (text)<\/h3>\n<ul>\n<li>Save and continue.<\/li>\n<li>Level-up choices between perks and skill ranks.<\/li>\n<li>Enemies telegraph heavy blows and breath attacks so you can defend.<\/li>\n<li>Random events: a wounded knight, a gambling imp, strange fountains, locked doors and more.<\/li>\n<li>Forge tempering and run curses that make things harder for a higher score.<\/li>\n<\/ul>\n<h3 id='v-v1'>V1: The First Descent (text)<\/h3>\n<ul>\n<li>A terminal roguelike: name a hero, pick a Warrior, Rogue or Mage, and go down.<\/li>\n<li>Move room to room by compass direction. Fight in turns with attacks, skills, defending, potions and fleeing.<\/li>\n<li>A merchant, shrines to pray at, gold and a high score.<\/li>\n<\/ul>"},"spr":{"logo_base":["data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAANoAAAB1CAYAAAAoV//gAAADYElEQVR42u3dMXLbMBAFUDLjc7jyIXz/yodw5YsgTQolMS2SwBIL8L2ZdA4Irryzf2BJXL8+P8ryjde393U5IHqdLb32eVSv685a52z1fObXAmg0mL3Ryp9/tVqtM/o+s1131jqnrKeJBhoN5vCycxQ/Onuq89c6X58f3/7Qw6nRrvH/sE7ZWKdqnxX3m+K6O07nZq1zr9fRRAONBjePjlsjOWoUb61fOu0z+n7Vue/9mmggOgKh0fHq6LT8M/JL5Tqos4kGGg2YLjpuRZPaUzLU2UQDjQa0jY5b70UUJYgQ8F5KEw1ER0CjcTujfAJdo4FGgxvYPHV8fXs/tNCOU0qojZAmGqDRQKOBRgM0GozgRQm40g/f53no5000QKPBaNHRJ3CJMOXvlYkGGg1ExyoVp0xbn8CtihitPlF+4lnPodfdqk+vOu94D21ptH8TDURHYJ7o+CDqaSa9TquyPn1m1DpP8T2TJhpoNJjDWjGK1yej/up1ttYtyWpdOr7GI9c5+vfNRAPREagao6Xi//ZYp9f6tfspCV7rTHVu9Sxs0RFER+DSRlsbjdls6/RaP9t1Z61ztnqaaKDRAAAA7mdd2v3B9OhJT6/3xkXvJ/q6o9S5BO9/7XS/p14XhyFwAY0GgzVatmcN99pP9HVHr3Or/Q9VBxMNREeYQ8tTx5+usTVqs9Wix75aXXeUOkfvP+Un6000EB1BdKyNBiVxTXrss9V1R38ay5R1MNFAo4HoeKca9Yge2U7PRn3dlgwR0kQDjQaiY/bvJ1waR4fs1y2T1Pnq/V/y+2CigegIc3gZcM+lMuKcPc2rve5VUakkqTMmGmg0EB0TR8mzEXKpjJJZI+TZ+xrtfk00QKOB6FgRbZbKKDnbaWS2OptogEYD0TFxxHEambPOJhqg0UB0nFCr08jWUe1Z5MVEA40GiI7dIlL270tsffqnziYaaDSgYXTces9b9Kjfu3709/r1ut9n1y1J6oyJBhoNRMcdUSPLqVH0e/DO3m/UeylnrbOJBmg0SGO9IHqkfKZwx/uNOg2dpc6tn2V9NAKHrG+igegI80XH1lHm7Kid5Znad3v6TKs6t9p/dP1FRxAdQaP9Nxp7/BHybtfttZ/R6zxUfUw0EB0BAAAAAAAAAAAAgGi/AeR9EVRyUJ7UAAAAAElFTkSuQmCC",218,117],"logo_mask":["dat if(!W){document.body.innerHTML='<main style="padding:40px;max-width:640px;font:16px/1.6 system-ui,sans-serif"><h1 style="font-size:24px">This is the wiki template, not the wiki</h1><p>It has no game data in it yet. From the game folder, run <code>python3 tools/make_wiki.py</code> and open <code>wiki/index.html</code>.</p></main>';throw new Error("Wiki template opened without data. Run tools/make_wiki.py.")}
const D=W.data,S=W.spr,C=D.consts;
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);
const slug=s=>s.toLowerCase().replace(/'/g,"").replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");
const pyRound=x=>{const f=Math.floor(x),d=x-f;if(Math.abs(d-.5)<1e-9)return f%2===0?f:f+1;return Math.round(x)};
const st={depth:1,route:"home"};
try{const v=+localStorage.getItem("hd-depth");if(v>=1&&v<=60)st.depth=v}catch(e){}

const img=(id,sc=2,alt="")=>{const s=S[id];if(!s)return"";return`<img class="px" src="${s[0]}" width="${s[1]*sc}" height="${s[2]*sc}" alt="${esc(alt)}" loading="lazy">`};
const itemIco=(fam,t=0,sc=2)=>{const s=S["item_"+fam];if(!s)return"";const z=14*sc;return`<span class="ico" role="img" aria-label="" style="display:inline-block;width:${z}px;height:${z}px;background:url(${s[0]}) -${t*z}px 0/${s[1]*sc}px ${z}px no-repeat;vertical-align:middle"></span>`};
const rc=i=>"r-"+D.rarities[i].col;
const colc=c=>D.colors[c]?"c-"+c:"";
const tag=t=>`<span class="tag">${esc(t)}</span>`;
const link=(id,txt)=>`<a href="#${id}">${txt}</a>`;
const tbl=(head,rows,opts={})=>`<div class="tw"><table${opts.id?` id="${opts.id}"`:""}><thead><tr>${head.map((h,i)=>`<th${h.num?' class="num"':""}${opts.sort?` data-sort="${i}"`:""}>${h.t??h}</th>`).join("")}</tr></thead><tbody>${rows.join("")}</tbody></table></div>`;
const tr=(cells,a={})=>`<tr${a.id?` id="${a.id}"`:""}${a.go?` class="go${a.off?" off":""}" data-go="${a.go}"`:a.off?' class="off"':""}>${cells.map(c=>typeof c==="object"&&c!==null?`<td class="${c.c||""}"${c.v!==undefined?` data-v="${c.v}"`:""}>${c.h}</td>`:`<td>${c}</td>`).join("")}</tr>`;
const fmtStat=(k,v)=>{const lab=(D.statlabel[k]||k).trim();const n=(Math.round(v*10)/10);const s=(n>0?"+":"")+n;return D.statlabel[k]&&D.statlabel[k].startsWith("%")?`${s}${lab}`:`${s} ${lab}`};
const fmtStats=o=>Object.entries(o).filter(([k,v])=>v).map(([k,v])=>fmtStat(k,v)).join(", ")||"no bonuses";

const scaleAt=n=>(1+.2*(n-1))*Math.pow(1.08,Math.max(0,n-C.final));
const hpMult=n=>{const p=C.hpcurve;if(n<=p[0][0])return p[0][1];for(let i=0;i<p.length-1;i++){const[a,x]=p[i],[b,y]=p[i+1];if(n<=b)return x+(y-x)*(n-a)/(b-a)}return p[p.length-1][1]};
const etier=n=>Math.min(2,Math.floor((n-1)/4));
const power=f=>1+.11*(f-1);
const PCT=new Set(["crit","dodge","burn_hit","poison_hit","chill_hit","lifesteal","crit_dmg","gold_find","ally"]);
const MAIN=new Set(["main","chest","ranged"]);
const damp=(k,m,kind)=>{if(PCT.has(k))return 1+(m-1)*.3;if(k==="df"||k==="guard")m=1+(m-1)*.45;if(!MAIN.has(kind))m=1+(m-1)*.6;return m};
const scaleStats=(stats,m,kind)=>Object.fromEntries(Object.entries(stats).map(([k,v])=>[k,v<0?v:Math.max(1,pyRound(v*damp(k,m,kind)))]));
const tierOdds=f=>{if(f<13){const c=Math.floor((f-1)/1.7),o={};[[-1,.2],[0,.6],[1,.2]].forEach(([d,p])=>{const t=Math.max(0,Math.min(6,c+d));o[t]=(o[t]||0)+p});return o}const x=6.35+(f-13)/5.5,b=Math.floor(x),fr=x-b,o={};const a=Math.min(C.maxtier,b),c2=Math.min(C.maxtier,b+1);o[a]=(o[a]||0)+(1-fr);o[c2]=(o[c2]||0)+fr;return o};
const likelyTier=f=>{const o=tierOdds(f);return +Object.entries(o).sort((a,b)=>b[1]-a[1])[0][0]};
const BASE=Object.fromEntries(D.bases.map(b=>[b.key,b]));
const itemStats=(fam,f,t,r=0)=>{const b=BASE[fam];let s=scaleStats(b.stats,power(f)*C.matmult[t],b.kind);if(r>0){const m=D.rarities[r].bmult;s=Object.fromEntries(Object.entries(s).map(([k,v])=>[k,v<0?v:Math.max(1,pyRound(v*m))]))}return s};
const uniqueStats=(u,f)=>{const b=BASE[u.family];const s=scaleStats(u.stats,power(f)*1.35,b.kind);for(const[k,v]of Object.entries(b.stats))if(!(k in s)&&v>0)s[k]=Math.max(1,pyRound(v*power(f)*1.1));return s};
const itemValue=(r,f)=>{const R=D.rarities[r].rank;return pyRound((14+3*f)*(1+R*(1+.5*Math.max(0,R-3)))*(r===4?1.5:1))};
const matName=(fam,t)=>D.materials[BASE[fam].mat][t][0];

const REG={tier0:"Floors 1 to 4",tier1:"Floors 5 to 8",tier2:"Floor 9 and deeper",abyss:"The Abyss",minion:"Summoned by guardians",mimic:"Hidden among chests"};
const OUTDOOR=new Set(["meadow","highlands","wildwood","dunes","fen"]);
const whereText=w=>w.startsWith("biome:")?(D.biomes[w.slice(6)]||{}).name+" floors":REG[w]||w;
const MINION_OF={};D.bosses.forEach(b=>{if(b.minion_id)(MINION_OF[b.minion_id]=MINION_OF[b.minion_id]||[]).push(b)});
const biomeOnly=e=>!e.where.some(w=>w.startsWith("tier")||w==="abyss"||w==="minion"||w==="mimic");
const inPool=(e,n)=>{const t="tier"+etier(n);if(e.where.includes(t))return true;if(n>C.final&&e.where.includes("abyss"))return true;if(n>C.final&&e.where.includes("biome:abyss"))return true;return false};
const enemyStats=(e,n,elite=false)=>{const tier=etier(n);let mult=1;if(biomeOnly(e))mult=1+.15*tier;const sc=scaleAt(n)*mult,hx=hpMult(n);
  const hulk=1,hp=Math.max(1,pyRound(e.hp*sc*hx*(elite?1.5:1)*hulk)),atk=Math.max(1,pyRound(e.atk*sc*(elite?1.15:1)));const bonus=elite?2.5:1;
  return{hp,atk,df:e.df,xp:pyRound((e.hp/2.5+e.atk*1.5)*sc*bonus),gold:pyRound((e.hp/8+e.atk*.5)*sc*bonus)*e.goldx,mult}};
const abyssBoss=(b,d)=>{const sc=scaleAt(d)/scaleAt(b.floor),hx=hpMult(d)/hpMult(C.final);return{hp:Math.max(1,pyRound(b.hp*sc*hx)),atk:Math.max(1,pyRound(b.atk*sc))}};
const abyssGates=()=>{const g=[];for(let d=16;d<=60;d+=4)g.push(d);return g};
const zone=n=>n<=4?"z1":n<=8?"z2":n<=12?"z3":"za";
const intent=k=>(D.intents[k]||k).replace(/(:| for) \{d\}/g,"").replace(/\{d\} ?/g,"");
const MOVE_NAME={hit:"Attack",bite:"Bite",slash:"Slash",drain:"Drain",steal:"Steal",heavy:"Heavy blow",fuse:"Light fuse",explode:"Explode",web:"Web",curse:"Hex",shoot:"Shoot",bolt:"Bolt",frostbolt:"Frost bolt",spit:"Spit",mend:"Mend",summon:"Summon",reanimate:"Reanimate",protect:"Protect",warcry:"War cry",guard:"Guard",regen:"Regenerate",slam:"Slam",sweep:"Sweep",charge:"Charge",webburst:"Web burst",miasma:"Miasma",flask:"Flask",inhale:"Inhale",breath:"Fire breath",roar:"Roar",meteor:"Meteor",blink:"Blink",screech:"Screech",gaze:"Gaze",wail:"Wail",devour:"Devour",spore:"Spores"};
const MOVE_EXTRA={blink:"Teleports to a new spot.",screech:"A piercing cry.",gaze:"A petrifying stare at the red area.",wail:"A wail that strikes the red area.",devour:"Feeds on the dead.",spore:"Releases spores.",frostbolt:"Will cast a frost bolt (Chill).",spit:"Will spit venom from range."};
const moveText=k=>D.intents[k]?intent(k):(MOVE_EXTRA[k]||"");
const CLS=Object.fromEntries(D.classes.map(c=>[c.key,c]));
const resName=r=>r;

function pages(){return[
 ["The hero",[["classes","Classes",D.classes.length],["companions","Companions",D.allies.length],["progression","Levels and talents"],["ossuary","The Ossuary",D.ossuary.length]]],
 ["The Hollow",[["floors","Floors and biomes",Object.keys(D.biomes).length],["layouts","Layouts",D.layouts.length+D.outdoor.length],["rooms","Rooms and landmarks"],["events","Events",D.events.length],["folk","Merchants and folk",D.npcs.length],["corpses","Corpses and traps"]]],
 ["Foes",[["enemies","Bestiary",D.enemies.length],["guardians","Guardians",D.bosses.length],["modifiers","Modifiers",Object.keys(D.affixes).length],["effects","Status effects",Object.keys(D.effects).length]]],
 ["Gear",[["gear","Base items",D.bases.length],["materials","Materials",C.maxtier+1],["rarities","Rarities",D.rarities.length],["affixes","Item modifiers",D.mods.length],["powers","Powers",Object.keys(D.powers).length],["gems","Gems and banes"],["uniques","Uniques",D.uniques.length],["sets","Sets",D.sets.length]]],
 ["Run items",[["relics","Relics",Object.keys(D.relics).length],["perks","Perks",Object.keys(D.perks).length],["consumables","Consumables"],["curses","Curses",Object.keys(D.curses).length],["daily","Daily run"]]],
 ["Reference",[["guide","Controls and tips"],["lore","Lore"],["changelog","Changelog"]]],
]}
const TITLES=Object.fromEntries(pages().flatMap(g=>g[1]).map(p=>[p[0],p[1]]));
TITLES.home="Home";

function nav(){$("#side").innerHTML=pages().map(([g,ps])=>`<h4>${g}</h4>`+ps.map(([id,t,n])=>`<a href="#${id}" data-r="${id}">${t}${n?`<span>${n}</span>`:""}</a>`).join("")).join("")}
function markNav(){const base=parentOf(st.route);document.querySelectorAll("nav.side a").forEach(a=>a.classList.toggle("on",a.dataset.r===base))}
function parentOf(r){if(r.startsWith("c-"))return"classes";if(r.startsWith("e-"))return"enemies";if(r.startsWith("b-"))return"guardians";if(r.startsWith("g-"))return"gear";if(r.startsWith("u-"))return"uniques";if(r.startsWith("s-"))return"sets";return r}

function flavor(){const n=st.depth;let t;if(n<=C.final)t=D.floorintro[n];else t=D.abyssintro[(n-13)%D.abyssintro.length];
  const g=n in{4:1,8:1,12:1}?D.bosses.filter(b=>b.floor===n).map(b=>b.name).join(" or "):n>C.final&&n%4===0?"an Abyssal guardian":null;
  const lab=n<=C.final?`Floor ${n}`:`Abyss, floor ${n}`;
  $("#flavor").innerHTML=`<b>${lab}</b><span>${esc(t)}</span>${g?`<span class="c-red">Guardian: ${esc(g)}</span>`:""}`}
function setDepth(n,from){n=Math.max(1,Math.min(60,n|0));if(n===st.depth)return;const d=n-st.depth;st.depth=n;try{localStorage.setItem("hd-depth",n)}catch(e){}syncDepth();rerender();
  const o=$("#dv");bumpEl(o);if(from){const r=from.getBoundingClientRect();popAt(r.left+r.width/2,r.top-6,"Floor "+n,"var(--gold)")}else{dSum+=d;clearTimeout(dT);dT=setTimeout(()=>{const r=o.getBoundingClientRect();if(dSum)popAt(r.left+r.width/2,r.top+4,(dSum>0?"+":"")+dSum,dSum>0?"var(--gold)":"var(--ice)");dSum=0},220)}}
let dSum=0,dT=null,burst=null,burstT=null;
const MOTION=!matchMedia("(prefers-reduced-motion: reduce)").matches;
function bumpEl(el){if(!el||!MOTION)return;el.classList.remove("bump");void el.offsetWidth;el.classList.add("bump")}
function popAt(x,y,text,color){if(!MOTION)return;const p=document.createElement("span");p.className="pop";p.textContent=text;p.style.left=x+"px";p.style.top=y+"px";p.style.color=color;document.body.appendChild(p);setTimeout(()=>p.remove(),950)}
const numOf=t=>{const m=String(t).replace(/,/g,"").match(/-?\d+(\.\d+)?/);return m?+m[0]:null};
function snap(){return[...document.querySelectorAll("#main .stat b, #main td.num")].map(e=>e.textContent)}
function rerender(){if(!burst||burst.route!==st.route)burst={route:st.route,before:snap()};render(true);clearTimeout(burstT);burstT=setTimeout(()=>{const b=burst;burst=null;if(b)diff(b)},220)}
function diff({route,before}){if(route!==st.route)return;const els=[...document.querySelectorAll("#main .stat b, #main td.num")];if(els.length!==before.length)return;
  let pops=0;els.forEach((el,i)=>{if(el.textContent===before[i])return;const a=numOf(before[i]),b=numOf(el.textContent);if(MOTION)el.classList.add("changed");
    if(el.matches(".stat b")&&a!==null&&b!==null&&pops<8){const r=el.getBoundingClientRect();if(r.bottom>0&&r.top<innerHeight){const dv=Math.round((b-a)*100)/100;pops++;setTimeout(()=>popAt(r.left+r.width/2,r.top,(dv>0?"+":"")+dv,dv>0?"var(--gold)":"var(--ice)"),pops*40)}}})}
function syncDepth(){$("#dv").value=st.depth;$("#dv").textContent=st.depth;$("#dr").value=st.depth;flavor()}

const ROUTES={};
function render(keepScroll){const r=st.route;const fn=ROUTES[r]||ROUTES[parentOf(r)+"*"]||ROUTES.home;const y=window.scrollY;
  hideTip();stopTitle();const m=$("#main");m.innerHTML=fn(r);document.title=(TITLES[r]||detailTitle(r)||"Hollow Descent")+" · Hollow Descent wiki";markNav();bindMain();
  if(keepScroll)window.scrollTo(0,y);else if(MOTION){m.classList.remove("enter");void m.offsetWidth;m.classList.add("enter")}
  if(st.bump){bumpEl(document.querySelector(st.bump));st.bump=null}startTitle()}
function detailTitle(r){const all=[...D.classes,...D.enemies,...D.bosses,...D.uniques,...D.sets];const x=all.find(o=>o.id===r);if(x)return x.name;if(r.startsWith("g-")&&BASE[r.slice(2)])return BASE[r.slice(2)].name;return null}
function go(id,anchor){const [r,a]=id.split("~");st.route=r||"home";render();const tgt=a||anchor;
  if(tgt){const el=document.getElementById(tgt);if(el){el.scrollIntoView({block:"center"});el.classList.add("flash");setTimeout(()=>el.classList.remove("flash"),1700)}}else window.scrollTo(0,0);
  $("#side").classList.remove("open");$("#menuBtn").setAttribute("aria-expanded","false")}
function fromHash(){const h=decodeURIComponent(location.hash.slice(1));go(h||"home")}

function bindMain(){
  document.querySelectorAll("#main tr.go").forEach(tr=>tr.addEventListener("click",e=>{if(e.target.closest("a,button,select"))return;location.hash=tr.dataset.go}));
  document.querySelectorAll("#main th[data-sort]").forEach(th=>th.addEventListener("click",()=>sortTable(th)));
  document.querySelectorAll("#main [data-depth]").forEach(b=>b.addEventListener("click",()=>setDepth(+b.dataset.depth,b)));
  document.querySelectorAll("#main .chips").forEach(ch=>ch.addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;st[ch.dataset.k]=b.dataset.v;st.bump=`#main .chips[data-k="${ch.dataset.k}"] button[data-v="${b.dataset.v}"]`;render(true)}));
  document.querySelectorAll("#main select[data-k]").forEach(s=>s.addEventListener("change",()=>{st[s.dataset.k]=s.value;st.bump=`#main select[data-k="${s.dataset.k}"]`;rerender()}));
  document.querySelectorAll("#main .tiers").forEach(t=>t.addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;st.tier=+b.dataset.t;st.tierPin=st.route.slice(2);st.bump=`#main .tiers button[data-t="${b.dataset.t}"]`;rerender()}));
  document.querySelectorAll("#main input[data-curse]").forEach(c=>c.addEventListener("change",()=>{st.curses=[...document.querySelectorAll("#main input[data-curse]:checked")].map(x=>x.dataset.curse);st.bump="#mult";rerender()}));
}
function sortTable(th){const table=th.closest("table"),i=+th.dataset.sort,tb=table.tBodies[0];const dir=th.dataset.dir==="asc"?"desc":"asc";
  table.querySelectorAll("th").forEach(x=>delete x.dataset.dir);th.dataset.dir=dir;
  const rows=[...tb.rows];const val=r=>{const c=r.cells[i];if(!c)return"";const v=c.dataset.v;return v!==undefined?(isNaN(+v)?v:+v):c.textContent.trim().toLowerCase()};
  rows.sort((a,b)=>{const x=val(a),y=val(b);const c=typeof x==="number"&&typeof y==="number"?x-y:String(x).localeCompare(String(y));return dir==="asc"?c:-c});rows.forEach(r=>tb.appendChild(r))}
const chips=(k,opts)=>`<div class="chips" data-k="${k}" role="group">${opts.map(([v,t])=>`<button type="button" data-v="${v}" aria-pressed="${(st[k]||opts[0][0])===v}">${t}</button>`).join("")}</div>`;

ROUTES.home=()=>{const n=st.depth;
  const cells=[],marks=[],ax=[];
  for(let f=1;f<=48;f++){const g=[4,8,12].includes(f)||(f>12&&f%4===0);
    cells.push(`<button type="button" class="cell ${zone(f)}${g?" g":""}${f===n?" cur":""}" data-depth="${f}" aria-label="Floor ${f}${g?", guardian":""}"></button>`);
    const b=f===4?"warden":f===8?"matron":f===12?"drake":f>12&&f%4===0?"warden_abyssal":null;
    marks.push(b?`<span style="display:flex;justify-content:center">${img(b,1,"")}</span>`:"<span></span>");
    ax.push(`<span>${f%4===0||f===1?f:""}</span>`)}
  const miles=[[1,"Wick the lamplighter's ghost waits for new players. Gear starts at Rusty and Burlap."],[4,"First guardian: the Bone Warden or the Goblin Warlord seals the stairs."],[6,"Altars of Ascension can appear. Vesh starts stocking a Mythic."],[7,"Mythic gear starts dropping, very rarely."],[8,"Second guardian: the Hollow Matron or the Plague Doctor."],[12,"The Ember Drake. Kill it to win, then step into the Endless Abyss."],[13,"The Abyss: everything scales faster, Fallen Stars appear, guardians drop Ascended gear."],[16,"First Abyssal guardian. Another waits every fourth floor."],[24,"Third Abyss gate. Killing its guardian unlocks the Voidwalker. Guardians can drop Primordial gear."],[25,"Wellsprings can appear."],[32,"Wellsprings can turn Primordial into Eternal."],[36,"Guardians can drop Eternal gear. Enemy health peaks at 5x."],[C.tierfirst[C.maxtier],"Godsteel and the other top material tier start showing up."]];
  miles.sort((a,b)=>a[0]-b[0]);
  const counts=pages();
  const L=S.logo_base,bds=["bd_city","bd_wood","bd_crypt"].filter(k=>S[k]);
  const ls=innerWidth<520?1:innerWidth<900?1.5:2;
  const banner=`<div class="title" aria-label="Hollow Descent">${bds.map((k,i)=>`<img class="bd px${i===0?" on":""}" src="${S[k][0]}" width="${S[k][1]*2}" height="${S[k][2]*2}" alt="">`).join("")}
    <div class="logo"><img class="px base" src="${L[0]}" width="${L[1]*ls}" height="${L[2]*ls}" alt="Hollow Descent"><span class="des" style="--m:url(${S.logo_mask[0]})"></span></div>
    <p class="tagline">${esc(D.taglines[st.tag??(st.tag=Math.floor(Math.random()*D.taglines.length))])}</p>
    <span class="corner" style="left:14px">${esc(D.version)}</span><span class="corner" style="right:14px">${D.enemies.length} monsters, ${D.bases.length} base items, ${D.uniques.length} relics</span></div>`;
  return`${banner}<h1>The wiki</h1><p class="lede">A turn-based pixel-art roguelike about a mine that goes down too far. This wiki is built straight from the game's data files for ${esc(D.version)}, so every stat matches the game.</p>
  <p>Pick a floor with the depth control at the top. Every monster's health, every item's stats, every price and cost on this wiki is recalculated for that floor. Click a floor on the strip below to jump there.</p>
  <div class="strata" aria-label="Floors 1 to 48"><div class="marks" aria-hidden="true">${marks.join("")}</div><div class="row">${cells.join("")}</div><div class="ax" aria-hidden="true">${ax.join("")}</div>
  <div class="legend"><span><i class="z1"></i>Floors 1 to 4</span><span><i class="z2"></i>5 to 8</span><span><i class="z3"></i>9 to 12</span><span><i class="za"></i>The Abyss</span><span>Taller bars are guardian floors</span></div></div>
  <dl class="miles">${miles.map(([f,t])=>`<dt><a href="#home" data-depth="${f}" style="text-decoration:none">${f}</a></dt><dd>${esc(t)}</dd>`).join("")}</dl>
  <h2>Everything in the wiki</h2><ul class="idx">${counts.map(([g,ps])=>`<li><h3>${g}</h3>${ps.map(([id,t,c])=>`<a href="#${id}">${t}${c?`<span>${c}</span>`:""}</a>`).join("")}</li>`).join("")}</ul>
  <p class="note" style="margin-top:20px">Generated from ${esc(D.version)} (${esc(D.date)}). Search with the box at the top, or press / to jump to it.</p>`};

ROUTES.classes=()=>`<h1>Classes</h1><p class="lede">Ten heroes. Four are open from the start, five are bought in the Ossuary, and one has to be earned at the bottom of the world.</p>
  <div class="roster">${D.classes.map(c=>`<a href="#${c.id}">${img("cls_"+c.key,4,c.name)}<b class="${colc(c.color)}">${c.name}</b><span>${c.unlock.kind==="start"?"Start":c.unlock.kind==="secret"?"Secret":c.unlock.cost+" shards"}</span></a>`).join("")}</div>
  ${tbl([{t:"Class"},{t:"HP",num:1},{t:"Resource"},{t:"ATK",num:1},{t:"ARC",num:1},{t:"Armor",num:1},{t:"Crit",num:1},{t:"Dodge",num:1},{t:"Unlock"}],D.classes.map(c=>tr([`<b class="${colc(c.color)}">${c.name}</b>`,{h:c.hp,c:"num",v:c.hp},`${c.mp} ${c.res}`,{h:c.atk,c:"num",v:c.atk},{h:c.arc,c:"num",v:c.arc},{h:c.df,c:"num",v:c.df},{h:c.crit+"%",c:"num",v:c.crit},{h:c.dodge+"%",c:"num",v:c.dodge},c.unlock.kind==="start"?"Start":c.unlock.kind==="secret"?"Secret":`Ossuary, ${c.unlock.cost} shards`],{go:c.id})),{sort:1})}
  <h2>Resources</h2><p>Every class spends one of six resources on skills.</p>
  ${tbl(["Resource","Starts at","Regenerates","Builds from","Notes"],Object.entries(D.resources).map(([k,r])=>{const b=[];if(r.attack)b.push(`attacking (+${r.attack})`);if(r.hit)b.push(`being hit (+${r.hit})`);if(r.block)b.push(`guarding (+${r.block})`);if(r.kill)b.push(`kills (+${r.kill})`);if(r.still)b.push(`standing still (x3)`);
    return tr([`<b class="${colc(r.color)}">${k}</b>`,Math.round(r.start*100)+"%",r.regen?`+${r.regen} per turn`:"No",b.join(", ")||"—",esc(r.tip)+(r.decay?` Drains ${r.decay} per turn outside combat${r.floor?`, never below ${r.floor}`:""}.`:"")+(r.rest?" Refills when resting.":"")])}))}`;

ROUTES["classes*"]=r=>{const c=D.classes.find(x=>x.id===r);if(!c)return ROUTES.classes();const res=D.resources[c.res];
  const skill=s=>`<div class="skill">${img("skill_"+slug(s.name),2,"")||`<span class="plinth" style="width:36px;height:36px"></span>`}<div><h4>${esc(s.name)}</h4><div class="meta">Level ${s.lvl}, ${s.cost} ${c.res}${s.cd?`, ${s.cd} turn cooldown`:""}${s.range?`, range ${s.range}`:""}${s.radius?`, radius ${s.radius}`:""}</div><div>${esc(s.desc)}</div></div></div>`;
  const kit=c.kit.map(f=>`<a href="#g-${f}" style="display:inline-flex;align-items:center;gap:6px;margin-right:14px;text-decoration:none">${itemIco(f,BASE[f].mat==="cloth"?1:0,2)}${esc(matName(f,BASE[f].mat==="cloth"?1:0))} ${esc(BASE[f].name)}</a>`).join("");
  return`<div class="crumb">${link("classes","Classes")}</div><div class="hero"><div class="plinth"><span class="idle" style="--px:6px;display:block">${img("cls_"+c.key,6,c.name)}</span></div><div>
  <h1 class="${colc(c.color)}">${c.name}</h1><p class="lede" style="margin-bottom:8px">${esc(c.lore)}</p>
  <div class="statline">${[["HP",c.hp],[c.res,c.mp],["ATK",c.atk],["ARC",c.arc],["Armor",c.df],["Crit",c.crit+"%"],["Dodge",c.dodge+"%"]].map(([a,b])=>`<div class="stat"><b>${b}</b><span>${a}</span></div>`).join("")}</div>
  <p><b>Trait.</b> ${esc(c.trait)}</p>${Object.keys(c.extra).length?`<p class="note">Also starts with ${fmtStats(c.extra)}.</p>`:""}
  <p class="note">${c.unlock.kind==="start"?"Available from the start.":c.unlock.kind==="secret"?esc(c.unlock.text)+` In practice: kill an Abyssal guardian on floor ${c.unlock.floor} or deeper.`:`Unlocked in the Ossuary for ${c.unlock.cost} shards.`}</p></div></div>
  <h2>Starting kit</h2><p>${kit}</p><p class="note">${c.caster?"Counts as a caster: gear scoring favors ARC.":"Gear scoring favors ATK."}</p>
  <h2>Resource: ${c.res}</h2><p>${esc(res.tip)}</p>
  <h2>Skills</h2><div class="box">${c.skills.map(skill).join("")}</div>
  <p class="note">Skills rank up to III (at campfires, level-ups and forgotten studies). Each rank adds 30% power.</p>
  <h2>Specializations</h2><p>At level ${C.spec} pick one. It adds a fifth skill, permanent bonuses and stronger versions of some skills.</p>
  <div class="cols">${c.specs.map(s=>`<div><h3 class="${colc(s.color)}">${esc(s.name)}</h3><p>${esc(s.desc)}</p><p class="note">Bonuses: ${fmtStats(s.stats)}${Object.keys(s.mods).length?`. ${Object.entries(s.mods).map(([k,v])=>`${k} +${Math.round((v-1)*100)}%`).join(", ")}`:""}${s.traits.length?`. Trait: ${s.traits.join(", ")}`:""}.</p>${skill(s.skill)}</div>`).join("")}</div>
  <h2>Talents</h2><p>A talent point every other level, spent down three branches. Reset them at a campfire for gold (${30+12*st.depth}g on floor ${st.depth}).</p>
  <div class="talents">${c.talents.map(b=>`<div><h3>${esc(b.branch)}</h3><ol>${b.talents.map(t=>`<li><b>${esc(t.name)}</b>. ${esc(t.desc)}</li>`).join("")}</ol></div>`).join("")}</div>
  <h2>On the road</h2>${c.corpse?`<p><b>With a corpse:</b> ${esc(c.corpse)}. ${link("corpses","More on corpses")}.</p>`:""}
  ${c.prologue?`<div class="quote">${esc(c.prologue)}</div>`:""}${c.quips.map(q=>`<div class="quote">${esc(q)}</div>`).join("")}
  ${c.epilogue.length?`<h3>If you win</h3><div class="quote">${c.epilogue.map(esc).join(" ")}</div>`:""}`};

const regionOf=e=>{if(e.where.some(w=>w.startsWith("tier")))return e.where.find(w=>w.startsWith("tier"));if(e.where.includes("minion"))return"minion";if(e.where.includes("mimic"))return"special";if(e.where.some(w=>w==="biome:abyss"))return"abyss";if(e.where.some(w=>OUTDOOR.has(w.slice(6))))return"wild";return"biome"};
const eTags=e=>[...(e.fly?["Flying"]:[]),...(e.slow?["Slow"]:[]),...(e.keep?["Keeps distance"]:[]),...(e.undead?["Undead"]:[]),...e.innate,...(e.aura?[cap(e.aura)+" aura"]:[]),...(e.goldx>1?["Gold x"+e.goldx]:[])];

  const list=D.enemies.filter(e=>f==="all"||regionOf(e)===f||(f==="here"&&inPool(e,n)));

ROUTES["enemies*"]=r=>{const e=D.enemies.find(x=>x.id===r);if(!e)return ROUTES.enemies();const n=st.depth,s=enemyStats(e,n),el=enemyStats(e,n,true);const boss=MINION_OF[e.id];

  <div class="statline">${[["Elite HP",el.hp],["Elite ATK",el.atk],["Elite XP",el.xp],["Elite gold",el.gold]].map(([a,b])=>`<div class="stat elite"><b>${b}</b><span>${a}</span></div>`).join("")}</div>

  ${e.innate.length?`<h2>Innate modifiers</h2>${e.innate.map(a=>`<p><b>${link("modifiers~mod-"+slug(a),esc(a))}</b>. ${esc(D.affixes[a])}</p>`).join("")}`:""}
  ${e.undead?`<p class="note">Undead: Templar holy damage hits it 50% harder, and the Deadlight Lantern adds 40%.</p>`:""}

  ${e.verbs.length?`<p class="note">In the log it ${e.verbs.map(esc).join(", ")} you.</p>`:""}`};

ROUTES.guardians=()=>{const n=st.depth;return`<h1>Guardians</h1><p class="lede">Every fourth floor a guardian seals the stairs. Each of the first three floors picks one of its guardians at random. In the Abyss, any of the five can return as an Abyssal guardian, scaled to the depth.</p>
  ${tbl(["",{t:"Guardian"},{t:"Floor",num:1},{t:"HP",num:1},{t:"ATK",num:1},{t:"Armor",num:1},{t:"Phases"}],D.bosses.map(b=>tr([{h:img(b.sprite,1.5,""),c:"sp"},`<b>${esc(b.name)}</b><br><span class="small muted">${esc(b.title||"")}</span>`,{h:b.floor,c:"num",v:b.floor},{h:b.hp,c:"num",v:b.hp},{h:b.atk,c:"num",v:b.atk},{h:b.df,c:"num",v:b.df},b.phases.map(p=>`below ${p.at*100}%: ${p.aff.join(", ")}`).join("; ")],{go:b.id})),{sort:1})}
  <h2>Abyssal guardians</h2><p>Floors 16, 20, 24 and so on. ${n>C.final&&n%4===0?`Floor ${n} has one.`:`The nearest is floor ${Math.max(16,Math.ceil(Math.max(n,13)/4)*4)}.`} Abyssal guardians scale their attack by depth and their health by the Abyss health curve, relative to their home floor.</p>
  ${tbl(["Floor",...D.bosses.map(b=>({t:esc(b.name)}))],abyssGates().slice(0,10).map(d=>tr([`<b>${d}</b>`,...D.bosses.map(b=>{const a=abyssBoss(b,d);return`${a.hp} HP, ${a.atk} ATK`})],{off:false})))}
  <h2>Rewards</h2><ul class="plain"><li>Arcane Dust (3 + floor/4) and Void Shards (2 + floor/6), a Rare-or-better item, a Set piece and a Legendary-or-better item.</li><li>Mythic gear: 12% on floor 4, 40% on floor 8, always from floor 12.</li><li>In the Abyss: always an Ascended item, plus Celestial (35% + 5% per floor past 16), Primordial from floor 24 (20% + 3% per floor) and Eternal from floor 36 (10% + 2% per floor).</li><li>A choice of relics, except on floor 12, where you win the run.</li><li>Its minions crumble when it dies. Guardian hits are capped at ${Math.round(C.bosscap*100)}% of your max HP.</li></ul>`};

ROUTES["guardians*"]=r=>{const b=D.bosses.find(x=>x.id===r);if(!b)return ROUTES.guardians();const n=st.depth;const ab=n>C.final&&n%4===0?abyssBoss(b,n):null;
  return`<div class="crumb">${link("guardians","Guardians")}</div><div class="hero"><div class="plinth">${img(b.sprite,4,b.name)}</div><div>
  <h1>${esc(b.name)}</h1><p class="lede" style="margin-bottom:6px">${esc(b.title||"")}</p><p class="muted">Guardian of floor ${b.floor}${b.undead?". Undead.":""}</p>
  <div class="statline">${[["HP",b.hp],["ATK",b.atk],["Armor",b.df],["XP",b.xp],["Gold",b.gold]].map(([a,v])=>`<div class="stat"><b>${v}</b><span>${a}</span></div>`).join("")}</div>
  ${ab?`<div class="statline"><div class="stat elite"><b>${ab.hp}</b><span>Abyssal HP, floor ${n}</span></div><div class="stat elite"><b>${ab.atk}</b><span>Abyssal ATK</span></div></div>`:""}</div></div>

  <h2>Moves</h2>${tbl(["Move","What it does"],[...new Set(b.moves)].map(m=>tr([`<b>${MOVE_NAME[m]||cap(m)}</b>`,esc(moveText(m))+(m==="summon"&&b.minion?` Calls ${link(b.minion_id,esc(b.minion)+"s")}.`:"")])))}
  <h2>Phases</h2>${b.phases.map(p=>`<p><b>Below ${p.at*100}% HP:</b> gains ${p.aff.map(a=>link("modifiers~mod-"+slug(a),a)).join(", ")}. <span class="muted">${esc(p.text)}</span></p>`).join("")}
  ${b.taunt.length?`<h2>Taunts</h2>${b.taunt.map(t=>`<div class="quote">${esc(t)}</div>`).join("")}`:""}${b.death?`<h3>On death</h3><div class="quote">${esc(b.death)}</div>`:""}
  <h2>As an Abyssal guardian</h2>${tbl([{t:"Floor"},{t:"HP",num:1},{t:"ATK",num:1}],abyssGates().map(d=>{const a=abyssBoss(b,d);return tr([d===n?`<b class="c-gold">${d}</b>`:d,{h:a.hp,c:"num"},{h:a.atk,c:"num"}])}))}`};
const slugE=name=>"e-"+slug(name);

ROUTES.modifiers=()=>{const n=st.depth,k=Math.min(4,(n<8?2:3)+(n>C.final+3?1:0));return`<h1>Modifiers</h1><p class="lede">Monsters can carry modifiers that stack onto their name. Elites have gold outlines and several at once.</p>

  <h2>How often</h2><ul class="plain"><li>On floor ${n}, an ordinary monster has a ${Math.round(Math.min(.8,.05+.03*n)*100)}% chance of one random modifier (more under the Mutation curse and on Haunted floors).</li><li>Elite pack leaders carry ${k} modifiers on floor ${n} (2 before floor 8, 3 after, 4 past floor 15).</li><li>Rooms spawn an elite pack ${Math.round((.22+(n>C.final?.1:0))*100)}% of the time from floor 2 (more with Elite Hunt).</li><li>Each modifier adds 30% to the XP and gold a monster is worth. Elites are worth 2.5x.</li><li>Abyssal is only for guardians that return in the Abyss.</li></ul>`};

ROUTES.effects=()=>`<h1>Status effects</h1><p class="lede">Buffs and debuffs, and the reactions you get from mixing them.</p>
  ${tbl(["Effect","Kind","Notes"],Object.entries(D.effects).map(([k,e])=>tr([`<b class="${colc(e.col)}">${esc(e.name)}</b>`,e.debuff?"Debuff":"Buff",esc(EFFECT_NOTES[k]||"")],{id:"fx-"+k})))}
  <h2>Reactions</h2>${tbl(["Combination","Result"],[tr(["<b class='c-orange'>Burn</b> on a <b class='c-ice'>Chilled</b> foe","<b>Thermal Shock</b>: removes the Chill and deals 3x the Burn's power + 4."]),tr(["<b class='c-orange'>Burn</b> on a <b class='c-violet'>Poisoned</b> foe","<b>Combust</b>: consumes the Poison and deals its power for each remaining turn (up to 5)."]),tr(["<b class='c-ice'>Chill</b> on a <b class='c-orange'>Burning</b> foe","Steam: removes the Burn and Weakens for 2 turns."]),tr(["Three stacks of <b class='c-ice'>Chill</b>","Frozen solid: Stunned for a turn. You can't be re-chilled for 4 turns after."])])}
  <p class="note">Flooded floors stop Burns entirely, Magma Vents double them, Frozen Caverns double Chill on enemies. Mages hit 25% harder with reactions, and the Overcharger relic doubles them. Guardians resist Stun half the time, and Unstoppable foes ignore Stun and Chill.</p>`;
const EFFECT_NOTES={poison:"Damage every turn. Stacks up to double its power.",burn:"Fire damage every turn.",bleed:"Damage every turn. Stacks up to double.",chill:"Stacks. At 3 stacks the target freezes.",stun:"Loses its next turn.",weak:"Deals less damage.",vuln:"Takes more damage.",regen:"Heals every turn.",evasive:"Much harder to hit.",marked:"Takes 25% more damage.",bearform:"Druid shapeshift: more ATK and armor, bleeding hits.",enraged:"Deals 30% more damage."};

  return`<h1>Base items</h1><p class="lede">${D.bases.length} base items across ten slots. Stats shown are for a Common item on floor ${n} in its most likely material (tier ${t+1} of ${C.maxtier+1}).</p>

  ${tbl(["",{t:"Item"},{t:"Slot"},{t:"Material"},{t:"Stats on floor "+n},{t:"Trait"}],list.map(b=>tr([{h:itemIco(b.key,t,2),c:"sp"},`<b>${esc(b.name)}</b>${b.two?" "+tag("Two-handed"):""}`,D.slotnames[b.kind],cap(b.mat)+`<br><span class="small muted">${esc(D.materials[b.mat][t][0])}</span>`,fmtStats(itemStats(b.key,n,t)),b.trait?`<b>${cap(b.trait)}</b>. ${esc(D.traits[b.trait])}`:b.special?`<b>${cap(b.special)}</b>. ${esc(D.specials[b.special])}`:"—"],{go:"g-"+b.key})),{sort:1})}

ROUTES["gear*"]=r=>{const b=BASE[r.slice(2)];if(!b)return ROUTES.gear();const n=st.depth;const t=st.tierPin===b.key?st.tier:likelyTier(n),ri=+(st.rar||0);
  const s=itemStats(b.key,n,t,ri),odds=tierOdds(n);
  const rOpts=[0,1,2,3,6,7,8,9,10];const uq=D.uniques.filter(u=>u.family===b.key),sets=D.sets.filter(x=>Object.values(x.pieces).includes(b.key));

  <p class="note">Base stats only, floor ${n}. Rarity multiplies base stats and adds ${D.rarities[ri].mods} modifier${D.rarities[ri].mods===1?"":"s"}${D.rarities[ri].powers?` and ${D.rarities[ri].powers} power${D.rarities[ri].powers>1?"s":""}`:""}. Template: ${fmtStats(b.stats)}.</p></div></div>
  <h2>Material tier</h2><p>Pick a tier. ${Object.entries(odds).map(([k,p])=>`${D.materials[b.mat][k][0]} ${Math.round(p*100)}%`).join(", ")} on floor ${n}.</p>
  <div class="tiers">${D.materials[b.mat].map((m,i)=>`<button type="button" data-t="${i}" aria-pressed="${i===t}">${itemIco(b.key,i,3)}<span>${esc(m[0])}</span></button>`).join("")}</div>
  ${b.trait?`<h2>Trait</h2><p><b>${cap(b.trait)}</b>. ${esc(D.traits[b.trait])}</p>`:""}
  ${b.rkind?`<h2>Ranged</h2><dl class="def"><dt>Type</dt><dd>${cap(D.rkinds[b.rkind])}</dd><dt>Range</dt><dd>${b.rng} tiles</dd><dt>Reload</dt><dd>${b.cd?b.cd+" turn"+(b.cd>1?"s":""):"None"}</dd>${b.special?`<dt>Special</dt><dd><b>${cap(b.special)}</b>. ${esc(D.specials[b.special])}</dd>`:""}</dl>`:""}
  <h2>Sockets</h2><p>Up to ${D.socketcap[b.kind]} socket${D.socketcap[b.kind]>1?"s":""}, plus extra on Unique, Ascended and higher rarities. Gems give their ${D.gemcat[b.kind]} bonus here.</p>

  ${kitOf.length||allyOf.length?`<h2>Carried by</h2><p>${[...kitOf.map(c=>link(c.id,c.name)+" (starting kit)"),...allyOf.map(a=>link("companions~"+a.id,esc(a.name)))].join(", ")}</p>`:""}`};

ROUTES.materials=()=>{const n=st.depth,odds=tierOdds(n),fams=Object.keys(D.materials);return`<h1>Materials</h1><p class="lede">Every item is made of one of twelve tiers of its material family. Higher tiers multiply base stats. The last four only show up in the Abyss.</p>
