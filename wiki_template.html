  <h2>Price list, floor ${n}</h2>${tbl(["Who","Item",{t:"Price",num:1}],[["Hesk","Health Potion",18+2*n],["Hesk","Mana Tonic",14+n],["Hesk","Fire Bomb",20+2*n],["Hesk","Antidote",12+n],["Hesk","Iron Scrap x3",12+n],["Hesk","Arcane Dust",22+2*n],["Hesk","Chipped gem",30+3*n],["Hesk","Relic (35% of the time)",160+20*n],["Jeweler","Mystery gem",35+5*n],["Jeweler","Polish a gem",(35+5*n)*2],["Jeweler","Drill a socket",(35+5*n)*3],["Captain","Warband charter",140+30*n],["Captain","Second charter",260+30*n],["Anvil","Temper (Legendary and below)",25+6*n],["Campfire","Reset talents",30+12*n],["Shrine","Offering",40+5*n]].map(([a,b,c])=>tr([a,b,{h:c+"g",c:"num"}])))}
  <p class="note">Before Famine (double), Thief's Gloves (25% off) and haggle bonuses (up to 40% off). Companion hire prices are on the ${link("companions","Companions")} page.</p>`};

ROUTES.corpses=()=>{const n=st.depth;return`<h1>Corpses and traps</h1><p class="lede">Bodies stay where enemies fall. Stand on one and press G.</p>
  <h2>Every class can</h2><ul class="plain"><li><b>Search the body</b> (once): 60% to find something (+15% for elites, +15% with Grave Robber). Gold (${4+2*n} to ${10+2*n} on floor ${n}), a consumable, materials, a gem or a piece of gear.</li><li><b>Burn it</b> so no enemy necromancer can raise it. Templars say the last rites instead, healing 5% HP and gaining 3 Faith.</li></ul>
  <h2>Class actions</h2>${tbl(["Class","Action","Result"],D.corpse.map(([k,a])=>tr([link("c-"+k,`<b class="${colc(CLS[k].color)}">${CLS[k].name}</b>`),esc(a),esc(CORPSE_RES[k]||"")])))}
  <h2>Traps</h2><p>Hidden traps reveal themselves when you walk close (always within 2 tiles for Rogues and Rangers). A visible trap is avoided 75% of the time, and dodge (plus 35% for trap-sensing classes) can save you from a hidden one.</p>
  ${tbl(["Trap","Effect"],D.traps.map(([a,b])=>tr([`<b class="c-red">${a}</b>`,esc(b)+(a==="Spikes"?` (${4+2*n} on floor ${n})`:a==="Darts"?` (${2+n} on floor ${n})`:"")])))}`};
const CORPSE_RES={alchemist:"+5 Reagents.",voidwalker:"+6 Void and heal 6% HP.",druid:"Regen for 4 turns.",berserker:"+6 Rage and Enraged for 3 turns.",ranger:"Heal 6% HP and +2 Iron Scrap.",necromancer:"+5 MP.",warrior:"+3 Iron Scrap.",mage:"XP: 6 + 2 per floor.",rogue:"A second, luckier search for gold and loot."};

ROUTES.guide=()=>`<h1>Controls and tips</h1>
  ${tbl(["Key","Action"],D.controls.map(([k,a])=>tr([`<b>${esc(k)}</b>`,esc(a)])))}
  <h2>Ask Wick</h2>${D.guide.map(([q,a])=>`<h3>${esc(q)}</h3>${a.map(t=>`<div class="quote">${esc(t)}</div>`).join("")}`).join("")}
  <h2>Tip cards</h2><dl class="def">${Object.entries(D.guidecards).map(([k,v])=>`<dt>${esc(cap(k))}</dt><dd>${esc(v)}</dd>`).join("")}</dl>`;

ROUTES.lore=()=>`<h1>Lore</h1><p class="lede">${esc(D.taglines.slice(1).join(" "))}</p>
  <h2>The foreman's journal</h2><p>Torn pages turn up in chests, barrels, libraries and on the floor.</p>${D.journal.map(t=>`<div class="quote">${esc(t)}</div>`).join("")}
  <h2>Openings</h2>${D.prologues.map(p=>`<div class="quote">${p.map(esc).join(" ")}</div>`).join("")}
  <h2>The guardians</h2>${D.bosses.map(b=>`<h3>${link(b.id,esc(b.name))}, ${esc(b.title||"")}</h3><div class="quote">${b.intro.map(esc).join(" ")}</div>`).join("")}
  <h2>Epitaphs</h2><ul class="plain">${D.epitaphs.map(t=>`<li>${esc(t)}</li>`).join("")}</ul>`;

ROUTES.changelog=()=>`<h1>Changelog</h1><div class="changelog">${D.changelog}</div>`;

let titleTimer=null,emberTimer=null;
function stopTitle(){clearInterval(titleTimer);clearInterval(emberTimer);titleTimer=emberTimer=null}
function startTitle(){const t=document.querySelector("#main .title");if(!t||!MOTION)return;let i=0;const bds=[...t.querySelectorAll(".bd")];
  if(bds.length>1)titleTimer=setInterval(()=>{bds[i].classList.remove("on");i=(i+1)%bds.length;bds[i].classList.add("on")},30000);
  const spawn=()=>{if(t.querySelectorAll(".ember").length>22)return;const e=document.createElement("span");e.className="ember";const life=4+Math.random()*4;
    e.style.left=(Math.random()*100)+"%";e.style.setProperty("--dx",(Math.random()*60-30)+"px");e.style.setProperty("--h",(160+Math.random()*220)+"px");
    e.style.animationDuration=life+"s";if(Math.random()<.4){e.style.width=e.style.height="2px"}t.appendChild(e);setTimeout(()=>e.remove(),life*1000)};
  for(let k=0;k<8;k++)setTimeout(spawn,k*300);emberTimer=setInterval(spawn,420)}

const PAGE_DESC={home:"The front page, with the floor strip and every section.",classes:"All ten heroes: stats, skills, specializations and talents.",companions:"Sellswords, beasts, golems and the dead who fight for you.",progression:"XP per level, level-up rewards, stat caps and party size.",ossuary:"Permanent upgrades bought with shards between runs.",floors:"The twelve floors, every biome and how enemy health scales.",layouts:"The eighteen dungeon layouts and the open-air floors.",rooms:"What special rooms can appear, how often, and what the landmarks do.",events:"The fifteen strange encounters and every choice they offer.",folk:"Hesk, Vesh, the Jeweler, the Captain and Wick, with prices.",corpses:"Searching, burning and using bodies, and the four kinds of trap.",enemies:"Every monster, with health and attack for the chosen floor.",guardians:"The five guardians and their Abyssal returns.",modifiers:"Monster modifiers like Vampiric and Splitting, and elite rules.",effects:"Buffs, debuffs and elemental reactions.",gear:"All base items with stats for the chosen floor.",materials:"Twelve tiers per material family, from Rusty to Godsteel.",rarities:"Common to Eternal: modifiers, powers, sockets and prices.",affixes:"Prefixes and suffixes rolled onto gear.",powers:"The special powers on Mythic and higher gear.",gems:"Six gems in three grades, and the banes on cursed gear.",uniques:"The twenty-six pedestal relics, with their stories.",sets:"Nine five-piece sets and their bonuses.",relics:"Run trinkets from guardians, altars and merchants.",perks:"Small permanent bonuses from level-ups and shrines.",consumables:"Potions, tonics, bombs and antidotes.",curses:"Run curses and the score multiplier they give.",daily:"Daily run rewards and streaks.",guide:"Controls, and Wick's answers to common questions.",lore:"The foreman's journal, openings, guardians and epitaphs.",changelog:"Every version from the first text game to now."};
const firstSentence=t=>{const m=String(t).match(/^.*?[.!?](\s|$)/);return m?m[0].trim():t};
const tipBox=(art,title,cls,cat,body)=>`<div class="tr">${art?`<div>${art}</div>`:""}<div><div class="tt ${cls||""}">${title}</div>${cat?`<div class="tc">${cat}</div>`:""}${body||""}</div></div>`;
function tipFor(id){if(!id)return"";const [r,a]=id.split("~");const n=st.depth;
  if(a){const e=IDX.find(x=>x.id===id);if(e)return tipBox(e.spr?img(e.spr,2,""):"",esc(e.title),"",esc(e.cat),e.raw?`<div class="tl">${esc(firstSentence(e.raw))}</div>`:"")}
  if(r.startsWith("c-")){const c=CLS[r.slice(2)];if(!c)return"";return tipBox(img("cls_"+c.key,2,""),c.name,colc(c.color),`${c.hp} HP, ${c.mp} ${c.res}, ${c.atk} ATK, ${c.arc} ARC`,`<div class="tl">${esc(c.trait)}</div>`)}
  if(r.startsWith("e-")){const e=D.enemies.find(x=>x.id===r);if(!e)return"";const s=enemyStats(e,n);return tipBox(img(e.sprite,2,""),esc(e.name),"",esc(e.where.map(whereText).join(", ")),`<div><span class="ts">${s.hp}</span> HP, <span class="ts">${s.atk}</span> ATK, <span class="ts">${s.df}</span> armor <span class="tl">on floor ${n}</span></div>${eTags(e).length?`<div class="tl">${esc(eTags(e).join(", "))}</div>`:""}`)}
  if(r.startsWith("b-")){const b=D.bosses.find(x=>x.id===r);if(!b)return"";const ab=n>C.final&&n%4===0?abyssBoss(b,n):null;return tipBox(img(b.sprite,1,""),esc(b.name),"c-red",esc(b.title||""),`<div>Guardian of floor ${b.floor}: <span class="ts">${b.hp}</span> HP, <span class="ts">${b.atk}</span> ATK</div>${ab?`<div class="tl">As an Abyssal guardian on floor ${n}: ${ab.hp} HP</div>`:""}`)}
  if(r.startsWith("g-")){const b=BASE[r.slice(2)];if(!b)return"";const t=likelyTier(n);return tipBox(itemIco(b.key,t,3),esc(matName(b.key,t)+" "+b.name),"",`${D.slotnames[b.kind]}${b.two?", two-handed":""}`,`<div class="ts">${fmtStats(itemStats(b.key,n,t))}</div>${b.trait?`<div class="tl">${cap(b.trait)}: ${esc(D.traits[b.trait])}</div>`:b.special?`<div class="tl">${cap(b.special)}: ${esc(D.specials[b.special])}</div>`:""}`)}
  if(r.startsWith("u-")){const u=D.uniques.find(x=>x.id===r);if(!u)return"";return tipBox(itemIco(u.family,Math.max(1,likelyTier(n)),3),esc(u.name),"r-unique","Unique "+esc(BASE[u.family].name),`<div class="ts">${fmtStats(uniqueStats(u,n))}</div><div>${esc(u.desc)}</div><div class="tl" style="margin-top:4px">${esc(firstSentence(u.lore))}</div>`)}
  if(r.startsWith("s-")){const x=D.sets.find(o=>o.id===r);if(!x)return"";return tipBox(Object.values(x.pieces).slice(0,1).map(f=>itemIco(f,likelyTier(n),3)).join(""),esc(x.name),"",`Set: ${Object.values(x.pieces).map(f=>BASE[f].name).join(", ")}`,x.bonus.map((t,i)=>`<div><span class="ts">${[2,3,5][i]}:</span> ${esc(t)}</div>`).join(""))}
  if(PAGE_DESC[r])return tipBox("",esc(TITLES[r]||cap(r)),"","",`<div class="tl">${esc(PAGE_DESC[r])}</div>`);
  return""}
const HOVER=matchMedia("(hover: hover) and (pointer: fine)").matches;
let tipT=null,tipEl=null,mx=0,my=0;
function placeTip(x,y){const t=$("#tip"),w=t.offsetWidth,h=t.offsetHeight;let px=x+16,py=y+14;if(px+w>innerWidth-8)px=x-w-12;if(py+h>innerHeight-8)py=innerHeight-h-8;t.style.left=Math.max(8,px)+"px";t.style.top=Math.max(8,py)+"px"}
function hideTip(){clearTimeout(tipT);tipEl=null;$("#tip").classList.remove("on")}
function tipTarget(el){const a=el.closest('a[href^="#"]:not(.brand),tr[data-go]');if(!a||a.closest("#results"))return null;return a}
function showTip(el,x,y){const id=el.dataset.go||decodeURIComponent(el.getAttribute("href").slice(1));const h=tipFor(id);if(!h)return;const t=$("#tip");t.innerHTML=h;t.classList.remove("on");void t.offsetWidth;t.classList.add("on");placeTip(x,y)}

const IDX=[];
function addIdx(id,title,cat,text,spr){IDX.push({id,title,cat,raw:text||"",text:(text||"").toLowerCase(),t:title.toLowerCase(),spr})}
function buildIndex(){
  Object.entries(TITLES).forEach(([id,t])=>addIdx(id,t,"Page",""));
  D.classes.forEach(c=>{addIdx(c.id,c.name,"Class",c.trait+" "+c.lore,"cls_"+c.key);c.skills.forEach(s=>addIdx(c.id,s.name,c.name+" skill",s.desc,"skill_"+slug(s.name)));c.specs.forEach(s=>{addIdx(c.id,s.name,c.name+" specialization",s.desc);addIdx(c.id,s.skill.name,s.name+" skill",s.skill.desc,"skill_"+slug(s.skill.name))});c.talents.forEach(b=>b.talents.forEach(t=>addIdx(c.id,t.name,c.name+" talent",t.desc)))});
  D.enemies.forEach(e=>addIdx(e.id,e.name,"Monster",e.where.map(whereText).join(" ")+" "+e.innate.join(" "),e.sprite));
  D.bosses.forEach(b=>addIdx(b.id,b.name,"Guardian",(b.title||"")+" floor "+b.floor,b.sprite));
  Object.entries(D.affixes).forEach(([a,d])=>addIdx("modifiers~mod-"+slug(a),a,"Monster modifier",d));
  Object.entries(D.effects).forEach(([k,e])=>addIdx("effects~fx-"+k,e.name,"Status effect",EFFECT_NOTES[k]));
  ["Thermal Shock","Combust","Frozen"].forEach(t=>addIdx("effects",t,"Reaction",""));
  D.bases.forEach(b=>addIdx("g-"+b.key,b.name,D.slotnames[b.kind],b.mat+" "+(b.trait||"")+" "+(b.special||""),null));
  Object.entries(D.traits).forEach(([k,v])=>addIdx("gear~trait-"+k,cap(k),"Weapon trait",v));
  Object.entries(D.materials).forEach(([f,l])=>l.forEach((m,i)=>addIdx("materials~tier-"+i,m[0],cap(f)+" material, tier "+(i+1),"")));
  D.rarities.forEach(r=>addIdx("rarities~rar-"+slug(r.name),r.name,"Rarity",r.src));
  D.mods.forEach(m=>addIdx("affixes~mod-"+slug(m.name),m.name,"Item modifier",m.stat));
  Object.entries(D.powers).forEach(([k,p])=>addIdx("powers~pow-"+k,p.name,"Power",p.desc));
  Object.entries(D.gems).forEach(([k,g])=>addIdx("gems~gem-"+k,g.name,"Gem",""));
  Object.entries(D.banes).forEach(([k,b])=>addIdx("gems~bane-"+k,b.name,"Bane",b.desc));
  D.uniques.forEach(u=>addIdx(u.id,u.name,"Unique "+BASE[u.family].name,u.desc+" "+u.lore,null));
  D.sets.forEach(s=>addIdx(s.id,s.name,"Set",s.bonus.join(" ")));
  Object.entries(D.relics).forEach(([k,v])=>addIdx("relics~rel-"+slug(k),k,"Relic",v));
  Object.entries(D.perks).forEach(([k,v])=>addIdx("perks~perk-"+slug(k),k,"Perk",v));
  Object.entries(D.consumables).forEach(([k,c])=>addIdx("consumables~cons-"+k,c.name,"Consumable",c.desc,"icon_"+c.icon));
  Object.entries(D.curses).forEach(([k,c])=>addIdx("curses~curse-"+k,c.name,"Curse",c.desc));
  D.ossuary.forEach(o=>addIdx("ossuary~oss-"+o.key,o.name.split(":")[0],"Ossuary upgrade",o.name));
  D.allies.forEach(a=>addIdx("companions~"+a.id,a.name,"Companion",a.role,"ally_"+a.key));
  Object.entries(D.biomes).forEach(([k,b])=>addIdx("floors~biome-"+k,b.name,"Biome",b.desc));
  [...D.layouts,...D.outdoor].forEach(l=>addIdx("layouts~lay-"+l.key,l.name,"Layout",(l.intro||[]).join(" ")));
  D.rooms.forEach(([k,t,c,d])=>addIdx("rooms~room-"+k,t,"Room",d));
  D.landmarks.forEach(l=>addIdx("rooms~lm-"+l.id,l.name,"Landmark",l.text,l.sprite));
  D.events.forEach(e=>addIdx("events~"+e.id,e.title,"Event",e.text.join(" "),e.sprite));
  D.npcs.forEach(p=>addIdx("folk~npc-"+p.id,p.name,"Character",p.text,p.sprite));
  D.traps.forEach(([a,b])=>addIdx("corpses",a+" trap","Trap",b));
}
function search(q){q=q.trim().toLowerCase();if(!q)return[];const words=q.split(/\s+/);const out=[];
  for(const e of IDX){let s=0;if(e.t===q)s=100;else if(e.t.startsWith(q))s=80;else if(e.t.includes(q))s=60;else if(words.every(w=>e.t.includes(w)))s=50;else if(words.every(w=>e.t.includes(w)||e.text.includes(w)||e.cat.toLowerCase().includes(w)))s=20;
    if(s){if(e.cat==="Page")s+=5;out.push([s,e])}}
  out.sort((a,b)=>b[0]-a[0]||a[1].title.localeCompare(b[1].title));const seen=new Set();return out.map(x=>x[1]).filter(e=>{const k=e.id+e.title;if(seen.has(k))return false;seen.add(k);return true}).slice(0,30)}
let hl=0,res=[];
function showResults(){const box=$("#results");const q=$("#q").value;res=search(q);hl=0;
  if(!q.trim()){box.classList.remove("on");box.innerHTML="";return}
  box.innerHTML=res.length?res.map((e,i)=>`<a href="#${e.id}" data-i="${i}" role="option" class="${i===0?"hl":""}"><span>${e.spr?img(e.spr,1,""):e.id.startsWith("g-")?itemIco(e.id.slice(2),0,2):e.id.startsWith("u-")?itemIco(D.uniques.find(u=>u.id===e.id).family,3,2):""}</span><span><b>${esc(e.title)}</b><span class="sn">${esc(e.cat)}</span></span><span class="cat"></span></a>`).join(""):`<div class="none">Nothing matches “${esc(q)}”. Try a monster, item, relic or class name.</div>`;
  box.classList.add("on")}
function pick(i){const e=res[i];if(!e)return;$("#q").value="";$("#results").classList.remove("on");location.hash=e.id;if(decodeURIComponent(location.hash.slice(1))===e.id)go(e.id)}

function init(){
  $("#brand").innerHTML=`${img("guide",2,"")}<span>Hollow Descent <small>wiki</small></span>`;
  nav();buildIndex();syncDepth();
  $("#dr").addEventListener("input",e=>setDepth(+e.target.value));
  $("#dm").addEventListener("click",()=>setDepth(st.depth-1));
  $("#dp").addEventListener("click",()=>setDepth(st.depth+1));
  $("#q").addEventListener("input",showResults);
  $("#q").addEventListener("keydown",e=>{const box=$("#results");if(e.key==="ArrowDown"||e.key==="ArrowUp"){e.preventDefault();if(!res.length)return;hl=(hl+(e.key==="ArrowDown"?1:-1)+res.length)%res.length;box.querySelectorAll("a").forEach((a,i)=>a.classList.toggle("hl",i===hl));box.querySelectorAll("a")[hl].scrollIntoView({block:"nearest"})}
    else if(e.key==="Enter"){e.preventDefault();pick(hl)}else if(e.key==="Escape"){$("#q").value="";box.classList.remove("on");$("#q").blur()}});
  $("#results").addEventListener("click",e=>{const a=e.target.closest("a[data-i]");if(!a)return;e.preventDefault();pick(+a.dataset.i)});
  document.addEventListener("click",e=>{if(!e.target.closest(".search"))$("#results").classList.remove("on")});
  document.addEventListener("keydown",e=>{if(e.key==="/"&&!/input|select|textarea/i.test(document.activeElement.tagName)){e.preventDefault();$("#q").focus()}});
  $("#menuBtn").addEventListener("click",()=>{const o=$("#side").classList.toggle("open");$("#menuBtn").setAttribute("aria-expanded",o)});
  document.addEventListener("click",e=>{const a=e.target.closest('a[href^="#"]');if(!a||a.closest("#results"))return;const id=decodeURIComponent(a.getAttribute("href").slice(1));if(a.dataset.depth)return;if(decodeURIComponent(location.hash.slice(1))===id){e.preventDefault();go(id)}});
  document.addEventListener("click",e=>{const a=e.target.closest("a[data-depth]");if(a){e.preventDefault()}});
  window.addEventListener("hashchange",fromHash);
  if(HOVER){document.addEventListener("mouseover",e=>{const el=tipTarget(e.target);if(el===tipEl)return;hideTip();if(!el)return;tipEl=el;mx=e.clientX;my=e.clientY;tipT=setTimeout(()=>tipEl===el&&showTip(el,mx,my),260)});
    document.addEventListener("mousemove",e=>{mx=e.clientX;my=e.clientY;if($("#tip").classList.contains("on"))placeTip(mx,my)});
    document.addEventListener("focusin",e=>{const el=tipTarget(e.target);if(!el){hideTip();return}tipEl=el;const r=el.getBoundingClientRect();showTip(el,r.left,r.bottom)});
    document.addEventListener("scroll",hideTip,{passive:true});document.addEventListener("mousedown",hideTip)}
  fromHash()}
init();
</script>
